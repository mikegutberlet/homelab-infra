# (/root/.config/sops/age/keys.txt). Generate it with `age-keygen` and paste the
# public key below before encrypting anything.
creation_rules:
  - path_regex: stacks/.*/secrets\.sops\.env$
    age: age1x622shlxk3letv5ra6qj23dut8mg2cvzlpjlad2vc5a2s2l0yueqknqtza
  # tofu/backup-state.sh: the encrypted copy of the OpenTofu state.
  - path_regex: tofu/terraform\.tfstate$
    age: age1x622shlxk3letv5ra6qj23dut8mg2cvzlpjlad2vc5a2s2l0yueqknqtza
