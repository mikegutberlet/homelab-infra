# gpu VM (RicksShip) with the Iris Pro 580 passed through for Quick Sync (/dev/dri).

# mem_limit/cpus (2026-10-22): caps sit above each container's measured peak, so one runaway app
# gets restarted instead of starving the whole VM. Page cache counts toward the cap and is
# reclaimed first, so a cap below a cache-heavy peak (SABnzbd, Tdarr) is fine.

x-common: &common
  restart: unless-stopped
  labels:
    autoheal: "true"

x-lsio-env: &lsio-env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

services:
  plex:
    <<: *common
    image: lscr.io/linuxserver/plex:latest
    network_mode: host # port 32400 plus discovery
    environment:
      <<: *lsio-env
      VERSION: docker
      PLEX_CLAIM: ${PLEX_CLAIM}
    devices: [/dev/dri:/dev/dri]
    volumes:
      - /opt/appdata/plex:/config
      - /opt/appdata/transcode/plex:/transcode
      - /mnt/nfs/Media:/mnt/nfs/Media:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:32400/identity"]
      interval: 60s
      retries: 3
      start_period: 120s

  emby:
    <<: *common
    image: lscr.io/linuxserver/emby:latest
    environment: *lsio-env
    ports: ["8096:8096"]
    devices: [/dev/dri:/dev/dri]
    volumes:
      - /opt/appdata/emby:/config
      - /opt/appdata/transcode/emby:/transcode
      - /mnt/nfs/Media:/mnt/nfs/Media:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/emby/System/Ping"]
      interval: 60s
      retries: 3
      start_period: 120s

  # The -vaapi tag stopped at v25.2.0 and its health check now fails on purpose (deprecated);
  # VAAPI/QSV ship in the base image. Pinned because upgrades migrate the database one way.
  # Config stays on the legacy path: the image prefers it over its /config default whenever it
  # exists, and the database stores absolute paths under it (sequential YAML schedules).
  # /transcode is the image default and keeps transcode scratch on local disk.
  ersatztv:
    <<: *common
    image: jasongdove/ersatztv:v26.3.0
    environment:
      TZ: ${TZ}
    ports: ["8409:8409"]
    devices: [/dev/dri:/dev/dri]
    volumes:
      - /opt/appdata/ersatztv:/root/.local/share/ersatztv
      - /opt/appdata/transcode/ersatztv:/transcode
      - /mnt/nfs/Media:/mnt/nfs/Media:ro

  # Immich: upstream layout. Its own Postgres because it needs a pinned vector extension.
  immich-server:
    <<: *common
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    # Runs as storage so uploads on the NAS are 3000:3000 (NFS squashes root); 44/104 = the
    # VM's video/render groups for /dev/dri.
    user: ${PUID}:${PGID}
    group_add: ["44", "104"]
    environment: &immich-env
      TZ: ${TZ}
      DB_HOSTNAME: immich-db
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
    ports: ["2283:2283"]
    devices: [/dev/dri:/dev/dri]
    volumes:
      # New uploads only, in a new folder (NAS/Photos/Immich-uploads, 3000:3000, created
      # 2026-10-21). NAS/Media/Immich is an empty leftover skeleton and is left alone.
      - /mnt/nfs/Photos/Immich-uploads:/usr/src/app/upload
      # Existing photos as a read-only external library (add /mnt/photos in Immich).
      - /mnt/nfs/Photos:/mnt/photos:ro
    depends_on:
      immich-db: {condition: service_healthy}
      immich-redis: {condition: service_healthy}

  immich-machine-learning:
    <<: *common
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}-openvino
    devices: [/dev/dri:/dev/dri]
    environment:
      MACHINE_LEARNING_WORKERS: 1
      MACHINE_LEARNING_MODEL_TTL: 300 # unload models after 5 idle minutes
    deploy:
      resources:
        limits:
          memory: 3G # the gpu VM has 10 GB shared with Plex/Emby transcodes
    volumes:
      - /opt/appdata/immich/model-cache:/cache

  immich-redis:
    <<: *common
    image: valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s

  immich-db:
    <<: *common
    # Same as the official docker-compose.yml of Immich v3.3.5 (checked 2026-10-21).
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    shm_size: 128mb
    volumes:
      - /opt/appdata/immich/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich"]
      interval: 30s
      retries: 5

  tdarr:
    <<: *common
    image: ghcr.io/haveagitgat/tdarr:latest
    mem_limit: 4g
    cpus: 4
    environment:
      <<: *lsio-env
      serverIP: 0.0.0.0
      serverPort: 8266
      webUIPort: 8265
      internalNode: "true"
      inContainer: "true"
      nodeName: gpu-vm
    ports: ["8265:8265", "8266:8266"]
    devices: [/dev/dri:/dev/dri]
    # 870 movie folders on the NAS still belong to user goobs (gid 1000, mode 775), so the
    # storage user alone cannot write the converted file next to the original. Joining group
    # 1000 lets Tdarr write there without re-permissioning any existing data (2026-10-22).
    group_add: ["1000"]
    volumes:
      - /opt/appdata/tdarr/server:/app/server
      - /opt/appdata/tdarr/configs:/app/configs
      - ./tdarr-init:/custom-cont-init.d:ro # adds abc to gid 1000 (group_add alone doesn't reach it)
      - /opt/appdata/tdarr/logs:/app/logs
      - /opt/appdata/transcode/tdarr:/temp # local disk, never NFS
      # Read-write since 2026-10-21: Tdarr re-encodes H.264 movies to HEVC in place (Goobs's OK).
      # The first day's originals go to the NAS holding folder instead of being deleted.
      - /mnt/nfs/Media:/mnt/nfs/Media
      - /mnt/nfs/to-delete:/mnt/nfs/to-delete

  # Unmanic gets its own folders and an off-hours schedule so it never fights Tdarr.
  unmanic:
    <<: *common
    image: josh5/unmanic:latest
    mem_limit: 2g
    cpus: 2
    environment: *lsio-env
    ports: ["8888:8888"]
    devices: [/dev/dri:/dev/dri]
    volumes:
      - /opt/appdata/unmanic:/config
      - /opt/appdata/transcode/unmanic:/tmp/unmanic
      # Read-only until Goobs decides which folders Unmanic may re-encode.
      - /mnt/nfs/Media:/library:ro

  # Curated home screen rows (2026-10-22). Kometa builds the Plex collections and pins the
  # featured ones to Home, daily at 05:00 (mostly Plex/TMDb API calls, no transcoding).
  # home-rows then copies the rows to Emby through the Home Screen Companion plugin (07:00).
  kometa:
    <<: *common
    image: kometateam/kometa:v2.5.3
    network_mode: host # reaches Plex on 127.0.0.1:32400
    user: ${PUID}:${PGID}
    # Kometa writes its logs and cache next to config.yml, so /config is appdata. It also
    # rewrites config.yml when it loads it, so the repo's read-only copy is copied in at each
    # start (a link fails with "Read-only file system"); edits apply after a restart.
    entrypoint: ["/tini", "-s", "--", "/bin/sh", "-c",
                 "rm -f /config/config.yml && cp /config/homelab/config.yml /config/config.yml && exec /.venv/bin/python3 /kometa.py \"$$@\"", "kometa"]
    environment:
      TZ: ${TZ}
      HOME: /config
      KOMETA_CONFIG: /config/config.yml
      KOMETA_TIMES: "05:00"
      KOMETA_PLEXTOKEN: ${PLEX_TOKEN}
      KOMETA_TMDBKEY: ${TMDB_API_KEY}
      KOMETA_MDBLISTKEY: ${MDBLIST_API_KEY}
    volumes:
      - /opt/appdata/kometa:/config
      - ./kometa:/config/homelab:ro
    depends_on: [plex]

  home-rows:
    <<: *common
    image: python:3.12-alpine
    network_mode: host # Plex 127.0.0.1:32400, Emby 127.0.0.1:8096, /health on :8097
    user: ${PUID}:${PGID}
    command: ["python", "-u", "/app/home_rows.py"]
    environment:
      TZ: ${TZ}
      PLEX_TOKEN: ${PLEX_TOKEN}
      EMBY_API_KEY: ${HOME_ROWS_EMBY_KEY}
      RUN_AT: "07:00"
    volumes:
      - ./home-rows:/app:ro
      - /opt/appdata/kometa/logs:/kometa/logs:ro # Kometa's last run, for /health
    depends_on: [emby, kometa]

  # Reports new image versions to the n8n digest on the apps VM; updates nothing itself
  # (ansible role ops auto-updates the hosts.yml auto_update list weekly).
  diun:
    <<: *common
    image: crazymax/diun:4
    command: serve
    hostname: gpu # Diun names the host it watches by its own hostname (else the container id)
    environment:
      TZ: ${TZ}
      DIUN_WATCH_SCHEDULE: "0 */6 * * *"
      DIUN_PROVIDERS_DOCKER: "true"
      DIUN_PROVIDERS_DOCKER_ENDPOINT: tcp://socket-proxy:2375
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: "true"
      DIUN_NOTIF_WEBHOOK_ENDPOINT: http://192.168.1.53:5678/webhook/homelab/diun # daily digest (n8n)
      DIUN_NOTIF_WEBHOOK_METHOD: POST
      DIUN_NOTIF_WEBHOOK_HEADERS_CONTENT-TYPE: application/json # Diun sets none; n8n then sees an empty body
    volumes:
      - /opt/appdata/diun:/data

  # Docker API for autoheal and Diun (2026-10-28, security plan step 11). They used to mount
  # /var/run/docker.sock, which is root on the VM (a read-only mount still allows every API call).
  # The proxy passes only what they use: reading containers, images, events and info, plus
  # restart/stop/kill for autoheal. Everything else (create, exec, volumes, ...) gets 403.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    read_only: true
    tmpfs: [/run]
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      EVENTS: 1
      ALLOW_RESTARTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      DOCKER_SOCK: tcp://socket-proxy:2375
    depends_on: [socket-proxy]
