# Movie rows for Plex. In smart_filter, a list under `all:` means every value must match, so
# rows that accept several studios or ratings use `any:`.
# Only New Releases is a "HomeRow" (pinned to Home for Goobs and shared users). Goobs's Home
# order (2026-10-26) is Continue Watching, New Releases, Recently Added Movies, then the TV
# Shows block. Plex keeps each library's Home rows together, so any other movie row on Home
# would push the TV rows down; the rest are "Row" rows, on the Movies library's Recommended tab
# and under Collections. Every row only ever lists
# movies already in the library. home-rows/home_rows.py copies the list-based ones to Emby by
# these exact names, so rename them in both places.

templates:
  HomeRow:
    visible_home: true
    visible_shared: true
    visible_library: true
  Row:
    visible_home: false
    visible_shared: false
    visible_library: true

collections:
  # ---- Recommended tab (New Releases is also on Home) ----
  Trending This Week:
    template: {name: Row}
    tmdb_trending_weekly: 200
    collection_order: custom
    summary: Movies trending on TMDb this week that are in the library.

  Popular Right Now:
    template: {name: Row}
    tmdb_popular: 300
    collection_order: custom
    summary: Movies popular on TMDb right now that are in the library.

  New Releases:
    template: {name: HomeRow}
    hub_priority: 1 # first Kometa row on Home
    smart_filter:
      sort_by: release.desc
      limit: 60
      all:
        release: 183 # released in the last ~6 months
    summary: Movies released in the last six months.

  # Seasonal rows (lists from Kometa's own seasonal defaults); each exists only in its dates.
  Halloween Movies:
    template: {name: Row}
    schedule: range(10/01-10/31)
    # IMDb list searches got "403 Forbidden" on 2026-10-22, so this uses TMDb's keyword plus
    # the usual Halloween franchises instead of Kometa's IMDb lists.
    plex_all: true
    filters:
      tmdb_keyword: halloween
    tmdb_collection:
      - 185103 # Hotel Transylvania
      - 11716 # Addams Family
      - 750822 # Addams Family (animated)
      - 313086 # The Conjuring
      - 91361 # Halloween
      - 8581 # A Nightmare on Elm Street
      - 1733 # The Mummy
      - 2980 # Ghostbusters
      - 751156 # Hocus Pocus
    smart_label: random
  Thanksgiving Movies:
    template: {name: Row}
    schedule: range(11/01-11/30)
    imdb_search:
      keyword.any: thanksgiving
      limit: 500
    smart_label: random
  Christmas Movies:
    template: {name: Row}
    schedule: range(12/01-12/31)
    mdblist_list: https://mdblist.com/lists/k0meta/christmas-extravaganza
    smart_label: random
  Valentine's Day Movies:
    template: {name: Row}
    schedule: range(02/01-02/14)
    imdb_search:
      list.any: ls032692441, ls000094398, ls057783436, ls064427905
      limit: 500
    smart_label: random

  Family Night:
    template: {name: Row}
    smart_filter:
      sort_by: random
      any:
        content_rating: [G, PG]
    summary: Rated G and PG.

  Top Rated of All Time:
    template: {name: Row}
    imdb_chart: top_movies
    collection_order: custom
    summary: IMDb's Top 250 movies that are in the library.

  Highly Rated, Not Yet Watched:
    template: {name: Row}
    smart_filter:
      sort_by: random
      all:
        unplayed: true
        audience_rating.gte: 7.5
    summary: Well-reviewed movies nobody here has watched yet.

  Superhero Movies:
    template: {name: Row}
    plex_all: true
    filters:
      tmdb_keyword: superhero
    smart_label: random

  Based on a True Story:
    template: {name: Row}
    plex_all: true
    filters:
      tmdb_keyword: based on true story
    smart_label: random

  Hidden Gems:
    template: {name: Row}
    plex_all: true
    filters:
      tmdb_vote_average.gte: 7.2
      tmdb_vote_count.gte: 150
      tmdb_vote_count.lte: 2500
    smart_label: random
    summary: Highly rated on TMDb but less well known.

  International Films in English:
    template: {name: Row}
    plex_search:
      all:
        audio_language: English
    filters:
      original_language.not: en
    smart_label: random
    summary: Foreign-language films that have an English audio track.

  Oscar Winners:
    template: {name: Row}
    imdb_award:
      event_id: ev0000003
      event_year: all
      category_filter:
        - best motion picture of the year
        - best picture
        - best picture, production
        - best picture, unique and artistic production
      winning: true
    collection_order: release.desc
    summary: Academy Award winners for Best Picture.

  Quick Watches:
    template: {name: Row}
    smart_filter:
      sort_by: random
      all:
        duration.gte: 60
        duration.lte: 95
    summary: Feature films of 95 minutes or less.

  Action Movies:
    template: {name: Row}
    smart_filter: {sort_by: random, all: {genre: Action}}
  Comedy Movies:
    template: {name: Row}
    smart_filter: {sort_by: random, all: {genre: Comedy}}
  Horror Movies:
    template: {name: Row}
    smart_filter: {sort_by: random, all: {genre: Horror}}
  Sci-Fi Movies:
    template: {name: Row}
    smart_filter: {sort_by: random, all: {genre: Science Fiction}}
  Thrillers:
    template: {name: Row}
    smart_filter: {sort_by: random, all: {genre: Thriller}}
  Romance Movies:
    template: {name: Row}
    smart_filter: {sort_by: random, all: {genre: Romance}}
  Animated Movies:
    template: {name: Row}
    smart_filter: {sort_by: random, all: {genre: Animation}}
  Documentaries:
    template: {name: Row}
    smart_filter: {sort_by: random, all: {genre: Documentary}}
  Crime Movies:
    template: {name: Row}
    smart_filter: {sort_by: random, all: {genre: Crime}}

  Classics:
    template: {name: Row}
    smart_filter:
      sort_by: random
      all:
        year.lte: 1979
        audience_rating.gte: 7
    summary: Well-loved movies from before 1980.

  Rom-Coms:
    template: {name: Row}
    smart_filter: {sort_by: random, all: {genre: [Romance, Comedy]}} # both genres
  Time Travel:
    template: {name: Row}
    plex_all: true
    filters:
      tmdb_keyword: time travel
    smart_label: random

  Drama Movies:
    template: {name: Row}
    smart_filter: {sort_by: random, all: {genre: Drama}}
  Adventure Movies:
    template: {name: Row}
    smart_filter: {sort_by: random, all: {genre: Adventure}}
  Fantasy Movies:
    template: {name: Row}
    smart_filter: {sort_by: random, all: {genre: Fantasy}}
  Mystery Movies:
    template: {name: Row}
    smart_filter: {sort_by: random, all: {genre: Mystery}}
  War Movies:
    template: {name: Row}
    smart_filter: {sort_by: random, all: {genre: War}}
  Westerns:
    template: {name: Row}
    smart_filter: {sort_by: random, all: {genre: Western}}
  Family Movies:
    template: {name: Row}
    smart_filter: {sort_by: random, all: {genre: Family}}

  80s Movies:
    template: {name: Row}
    smart_filter: {sort_by: random, all: {decade: 1980}}
  90s Movies:
    template: {name: Row}
    smart_filter: {sort_by: random, all: {decade: 1990}}
  2000s Movies:
    template: {name: Row}
    smart_filter: {sort_by: random, all: {decade: 2000}}
  2010s Movies:
    template: {name: Row}
    smart_filter: {sort_by: random, all: {decade: 2010}}

  Pixar:
    template: {name: Row}
    smart_filter: {sort_by: release.asc, any: {studio: [Pixar, Pixar Animation Studios]}}
  Disney:
    template: {name: Row}
    smart_filter: {sort_by: release.asc, any: {studio: [Walt Disney Pictures, Walt Disney Animation Studios, Walt Disney Productions]}}
  DreamWorks:
    template: {name: Row}
    smart_filter: {sort_by: release.asc, any: {studio: [DreamWorks Animation, DreamWorks Pictures]}}
  Marvel Studios:
    template: {name: Row}
    smart_filter: {sort_by: release.asc, all: {studio: Marvel Studios}}
  A24:
    template: {name: Row}
    smart_filter: {sort_by: release.desc, all: {studio: A24}}
