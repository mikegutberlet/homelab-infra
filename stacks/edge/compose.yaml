# edge VM (RicksGarage): the only way into any app.
# Request path: Tailscale device -> TSDProxy (app.<tailnet>.ts.net, TLS) -> Traefik -> Authentik -> app.

# mem_limit/cpus (2026-10-22): caps sit above each container's measured peak, so one runaway app
# gets restarted instead of starving the whole VM. Page cache counts toward the cap and is
# reclaimed first, so a cap below a cache-heavy peak (SABnzbd, Tdarr) is fine.

x-common: &common
  restart: unless-stopped
  labels:
    autoheal: "true"
  environment:
    TZ: ${TZ}

services:
  traefik:
    <<: *common
    image: traefik:v3.3
    command:
      # Routes come only from the file provider (docs/gen_routes.py); the Docker provider was
      # removed 2026-10-22 (it failed every few seconds: Traefik 3.3's Docker client is older than
      # the daemon's minimum API, and no container carries traefik labels anyway).
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      # TSDProxy terminates TLS and forwards over plain HTTP. Trust its X-Forwarded-*
      # headers (Docker's private range only; LAN clients keep their 192.168.1.x source),
      # otherwise Authentik builds http:// URLs and browsers block them as mixed content.
      - --entrypoints.web.forwardedHeaders.trustedIPs=172.16.0.0/12
      - --ping=true
      - --ping.entryPoint=web # http://192.168.1.50/ping answers for Homepage and Kuma
      - --api.dashboard=true
      # 3xx-5xx only: the 200s are mostly UI polls that carry API keys in the query string
      # (SABnzbd's ?apikey=), and the lines that matter for a lockout are the 302/401/403s.
      - --accesslog=true
      - --accesslog.filters.statusCodes=300-599
      # Prometheus on the apps VM scrapes :8082 (published; DOCKER-USER keeps it to the lab VMs).
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entryPoint=metrics
      - --metrics.prometheus.addRoutersLabels=true
    environment:
      TZ: ${TZ}
      TS_TAILNET: ${TS_TAILNET}
    ports:
      - "80:80"
      - "8082:8082"
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks: [proxy]
    healthcheck:
      # ping lives on the web entrypoint (:80); the probe needs that entrypoint, on loopback
      # (a bare ":80" makes the healthcheck dial "http://:80" and fail)
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entryPoint=web", "--entrypoints.web.address=127.0.0.1:80"]
      interval: 30s
      retries: 3

  authentik-db:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD}
    volumes:
      - /opt/appdata/authentik/db:/var/lib/postgresql/data
    networks: [authentik]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 30s
      retries: 5

  authentik-redis:
    <<: *common
    image: redis:7-alpine
    networks: [authentik]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s

  authentik-server:
    <<: *common
    image: ghcr.io/goauthentik/server:2025.8
    mem_limit: 1g
    command: server
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
    # 9000 on the LAN is only for health checks from the lab VMs (lanfw drops everyone else);
    # logins still go through Traefik at auth.<tailnet>.
    ports: ["9000:9000"]
    depends_on:
      authentik-db: {condition: service_healthy}
      authentik-redis: {condition: service_healthy}
    networks: [authentik, proxy]

  authentik-worker:
    <<: *common
    image: ghcr.io/goauthentik/server:2025.8
    mem_limit: 1g
    command: worker
    environment: *authentik-env
    depends_on:
      authentik-db: {condition: service_healthy}
      authentik-redis: {condition: service_healthy}
    networks: [authentik]

  # Gives every app its own <app>.<tailnet>.ts.net name with a Tailscale certificate.
  tsdproxy:
    <<: *common
    image: almeidapaulopt/tsdproxy:1
    mem_limit: 1g
    environment:
      TZ: ${TZ}
    # TSDProxy 1.4 ignores TSDPROXY_AUTHKEY once tsdproxy.yaml defines a provider,
    # so the key reaches it as a file (authKeyFile) instead.
    secrets: [tsdproxy_authkey]
    volumes:
      - ./tsdproxy:/config
      - /opt/appdata/tsdproxy:/data
    networks: [proxy]

  # Subnet router: phones and laptops on the Tailnet reach 192.168.1.0/24.
  tailscale:
    <<: *common
    image: tailscale/tailscale:stable
    hostname: lab-router
    network_mode: host
    cap_add: [NET_ADMIN, SYS_MODULE]
    devices: [/dev/net/tun]
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_ROUTES: 192.168.1.0/24
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      # /metrics for Prometheus (host network: lanfw's LANFW-IN lets only the apps VM in).
      TS_ENABLE_METRICS: "true"
      TS_LOCAL_ADDR_PORT: 0.0.0.0:9002
    volumes:
      - /opt/appdata/tailscale:/var/lib/tailscale

  # Fallback way in if Tailscale is down. Keys only; one UDP port forwarded on the router.
  wg-easy:
    <<: *common
    image: ghcr.io/wg-easy/wg-easy:15
    cap_add: [NET_ADMIN, SYS_MODULE]
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.src_valid_mark: 1
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    volumes:
      - /opt/appdata/wg-easy:/etc/wireguard
    networks: [proxy]

  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

secrets:
  tsdproxy_authkey:
    environment: TS_AUTHKEY

networks:
  authentik: {internal: true}
  proxy: {}
