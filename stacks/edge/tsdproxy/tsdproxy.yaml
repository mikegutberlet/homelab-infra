# Checked against TSDProxy 1.4.7 (2026-10-21): proxy lists live under "files:", and the
# auth key comes from the compose secret below (the TSDPROXY_AUTHKEY env var is ignored).
defaultProxyProvider: default
tailscale:
  providers:
    default:
      authKeyFile: /run/secrets/tsdproxy_authkey
  dataDir: /data/
files:
  apps:
    filename: /config/apps.yaml
    defaultProxyProvider: default
http:
  hostname: 0.0.0.0
  port: 8080
log:
  level: info
