# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
# TRaSH Guides quality profiles and custom formats, synced daily (Recyclarr 8).
# The TRaSH profiles are applied to Goobs's existing profiles by name (chosen 2026-10-21),
# so series/movies keep the profile they already use. Same profiles as the TRaSH
# "web-1080p" (Sonarr) and "hd-bluray-web" (Radarr) templates; a profile's default
# custom-format groups come with it.
# Both top out at 1080p (no 4K, by choice).
#
# Quality floor (Goobs, 2026-10-22): the guide profiles allow only 1080p (Sonarr) or
# 1080p/720p Bluray (Radarr), so anything else stayed missing. Goobs wants a 480p floor
# instead, torrents being a fallback for obscure titles, and never a cam/telesync/screener.
# The `qualities` lists below override the guide's: same top tiers and cutoff, then 720p and
# the SD tiers down to 480p, and everything below 480p, 4K, remuxes and discs disabled.
# "No CAM/TS/Screener" is a hand-made custom format in both apps (release-title regex,
# score -10000); it is kept out of reset_unmatched_scores so the daily sync leaves it alone.
#
# Smaller files (Goobs, 2026-10-23): the guide sizes set "preferred" at the maximum, so the
# largest 1080p release always won (10-15 GB Bluray encodes), and Radarr kept "upgrading" WEB-DLs
# to Bluray. Now: 1080p WEB and Bluray are one tier in every profile (WEB-DL wins on score), sizes
# are capped and prefer a lean file, x265 (8-bit) gets a bonus, 10-bit is rejected for new grabs
# (target format is 8-bit HEVC, see docs/wiki/06-media-library.md), and a 1080p file is final:
# the main profiles stop upgrading at 1080p with score -10000, so files already on disk (including
# the ~1,200 10-bit HEVC ones) are never replaced. Lower tiers still upgrade to 1080p.
sonarr:
  sonarr: # v8: instance names must be unique across Sonarr and Radarr
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY
    # Sizes are MB per minute. Guide: preferred 995 (= biggest wins), Bluray-1080p min 50.4.
    # 1080p: 4-65, aim 20 (about 0.9 GB per 45-minute episode); 720p: 3-35, aim 12.
    quality_definition:
      type: series
      qualities:
        - { name: WEBDL-1080p, min: 4, preferred: 20, max: 65 }
        - { name: WEBRip-1080p, min: 4, preferred: 20, max: 65 }
        - { name: Bluray-1080p, min: 4, preferred: 20, max: 65 }
        - { name: HDTV-1080p, min: 4, preferred: 20, max: 65 }
        - { name: WEBDL-720p, min: 3, preferred: 12, max: 35 }
        - { name: WEBRip-720p, min: 3, preferred: 12, max: 35 }
        - { name: Bluray-720p, min: 3, preferred: 12, max: 35 }
        - { name: HDTV-720p, min: 3, preferred: 12, max: 35 }
    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        # The profile 538 of 541 series use (the name really ends with a space).
        name: &sonarr_main "Anything Not Terrible "
        reset_unmatched_scores:
          enabled: true
          except: ["No CAM/TS/Screener"]
        upgrade:
          allowed: true
          until_quality: 1080p
          until_score: -10000 # a 1080p file is final, whatever its score
        qualities:
          - name: 1080p
            qualities: [WEBDL-1080p, WEBRip-1080p, Bluray-1080p]
          - name: HDTV-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities: [WEBDL-720p, WEBRip-720p]
          - name: HDTV-720p
          - name: Bluray-576p
          - name: Bluray-480p
          - name: WEB 480p
            qualities: [WEBDL-480p, WEBRip-480p]
          - name: DVD
          - name: SDTV
          - name: Bluray-2160p Remux
            enabled: false
          - name: Bluray-2160p
            enabled: false
          - name: WEB 2160p
            enabled: false
            qualities: [WEBDL-2160p, WEBRip-2160p]
          - name: HDTV-2160p
            enabled: false
          - name: Bluray-1080p Remux
            enabled: false
          - name: Raw-HD
            enabled: false
          - name: Unknown
            enabled: false
      # Foreign-language series (moved here daily by profile-sorter). Same qualities and TRaSH
      # formats as above, minus "Language: Not Original" (it rejects English-only dubs), plus
      # home-lab formats that rank an English dub above original audio only (Goobs prefers dubs
      # over subtitles, 2026-10-22). User-defined (no trash_id), so no guide language rule applies.
      - name: &sonarr_foreign Foreign - Prefer English Dub
        reset_unmatched_scores:
          enabled: true
          except: ["No CAM/TS/Screener"]
        upgrade:
          allowed: true
          until_quality: 1080p
          until_score: 2000 # a dub (+2000) or an English-tagged tiered release ends upgrades
        min_format_score: 0
        min_upgrade_format_score: 1
        qualities:
          - name: 1080p
            qualities: [WEBDL-1080p, WEBRip-1080p, Bluray-1080p]
          - name: HDTV-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities: [WEBDL-720p, WEBRip-720p]
          - name: HDTV-720p
          - name: Bluray-576p
          - name: Bluray-480p
          - name: WEB 480p
            qualities: [WEBDL-480p, WEBRip-480p]
          - name: DVD
          - name: SDTV
          - name: Bluray-2160p Remux
            enabled: false
          - name: Bluray-2160p
            enabled: false
          - name: WEB 2160p
            enabled: false
            qualities: [WEBDL-2160p, WEBRip-2160p]
          - name: HDTV-2160p
            enabled: false
          - name: Bluray-1080p Remux
            enabled: false
          - name: Raw-HD
            enabled: false
          - name: Unknown
            enabled: false
    custom_formats:
      # The WEB-1080p guide formats, for the user-defined foreign profile.
      - trash_ids:
          - ec8fa7296b64e8cd390a1600981f3923 # Repack/Proper
          - eb3d5cc0a2be0db205fb823640db6a3c # Repack2
          - 44e7c4de10ae50265753082e5dc76047 # Repack3
          - e6258996055b9fbab7e9cb2f75819294 # WEB Tier 01
          - 58790d4e2fdcd9733aa7ae68ba2bb503 # WEB Tier 02
          - d84935abd3f8556dcd51d4f27e22d0a6 # WEB Tier 03
          - d0c516558625b04b363fa6c5c2c7cfd4 # WEB Scene
          # Home-lab formats from ../recyclarr-extra/custom-formats/sonarr.
          - f7981de50c8515d8c2ff2afbf303d38d # Homelab: English Tag (+1000, title only)
          - f12cacec1d53d2f8cfb36d384fd32a7a # Homelab: Dubbed or Dual Audio (+2000)
          - 7572bfe6bb8e657b4918d81a60f1103c # Homelab: Not Original or English (-10000)
        assign_scores_to:
          - name: *sonarr_foreign
      # Smaller files (2026-10-23): x265 is welcome (the Golden Rule group below scores it -10000),
      # 10-bit is not (the target is 8-bit HEVC; the iGPU can't decode 10-bit when a client transcodes).
      - trash_ids:
          - 47435ece6b99a0b477caf360e79ba0bb # x265 (HD)
        assign_scores_to:
          - name: *sonarr_main
            score: 500
          - name: *sonarr_foreign
            score: 500
      - trash_ids:
          - b2550eb333d27b75833e25b8c2557b38 # 10bit
        assign_scores_to:
          - name: *sonarr_main
            score: -10000
          - name: *sonarr_foreign
            score: -10000
    # A group listed here is no longer auto-synced to the guide-backed profile, so every entry
    # names the main profile too, or its scores there reset to 0 (seen in the 2026-10-22 preview).
    custom_format_groups:
      add:
        - trash_id: 59c3af66780d08332fdc64e68297098f # [Unwanted] Unwanted Formats
          assign_scores_to: [name: *sonarr_main, name: *sonarr_foreign]
        - trash_id: abe720fab2d27682adc2a735136cec02 # Streaming Services General
          assign_scores_to: [name: *sonarr_main, name: *sonarr_foreign]
        - trash_id: 85fae4a2294965b75710ef2989c850eb # HD/UHD Streaming Boost
          assign_scores_to: [name: *sonarr_main, name: *sonarr_foreign]
        - trash_id: 158188097a58d7687dee647e04af0da3 # Golden Rule HD (x265 (HD))
          assign_scores_to: [name: *sonarr_main, name: *sonarr_foreign]

radarr:
  radarr:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY
    # Sizes are MB per minute. Guide: preferred 1999 (= biggest wins), Bluray-1080p min 50.8 (6 GB
    # for a 2-hour film, which rejected lean encodes). 1080p: 8-70, aim 25 (about 3 GB for 2 hours,
    # cap 8.4 GB); 720p: 5-40, aim 15.
    quality_definition:
      type: movie
      qualities:
        - { name: WEBDL-1080p, min: 8, preferred: 25, max: 70 }
        - { name: WEBRip-1080p, min: 8, preferred: 25, max: 70 }
        - { name: Bluray-1080p, min: 8, preferred: 25, max: 70 }
        - { name: HDTV-1080p, min: 8, preferred: 25, max: 70 }
        - { name: WEBDL-720p, min: 5, preferred: 15, max: 40 }
        - { name: WEBRip-720p, min: 5, preferred: 15, max: 40 }
        - { name: Bluray-720p, min: 5, preferred: 15, max: 40 }
        - { name: HDTV-720p, min: 5, preferred: 15, max: 40 }
    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
        name: &radarr_main Anything Not terrible
        reset_unmatched_scores:
          enabled: true
          except: ["No CAM/TS/Screener"]
        upgrade:
          allowed: true
          until_quality: 1080p
          until_score: -10000 # a 1080p file is final, whatever its score
        qualities:
          - name: 1080p
            qualities: [Bluray-1080p, WEBDL-1080p, WEBRip-1080p]
          - name: Bluray-720p
          - name: WEB 720p
            qualities: [WEBDL-720p, WEBRip-720p]
          - name: HDTV-1080p
          - name: HDTV-720p
          - name: Bluray-576p
          - name: Bluray-480p
          - name: WEB 480p
            qualities: [WEBDL-480p, WEBRip-480p]
          - name: DVD
          - name: SDTV
          # Everything below is off: 4K, remuxes and discs (no 4K; Roku/phone can't play them),
          # DVD-R images, and the cam-era junk Goobs never wants.
          - name: Remux-2160p
            enabled: false
          - name: Bluray-2160p
            enabled: false
          - name: WEB 2160p
            enabled: false
            qualities: [WEBDL-2160p, WEBRip-2160p]
          - name: HDTV-2160p
            enabled: false
          - name: Remux-1080p
            enabled: false
          - name: BR-DISK
            enabled: false
          - name: Raw-HD
            enabled: false
          - name: DVD-R
            enabled: false
          - name: DVDSCR
            enabled: false
          - name: REGIONAL
            enabled: false
          - name: TELECINE
            enabled: false
          - name: TELESYNC
            enabled: false
          - name: CAM
            enabled: false
          - name: WORKPRINT
            enabled: false
          - name: Unknown
            enabled: false
      # Foreign-language movies (moved here daily by profile-sorter). Same qualities and TRaSH
      # formats as above, except: language Any instead of Original (Original rejects a release
      # tagged English-only), Bluray-1080p and WEB 1080p merged into one group so a dubbed WEB-DL
      # is not "upgraded" to a subtitles-only Bluray (quality outranks format score), and
      # home-lab formats that rank an English dub above original audio only (Goobs, 2026-10-22).
      - name: &radarr_foreign Foreign - Prefer English Dub
        reset_unmatched_scores:
          enabled: true
          except: ["No CAM/TS/Screener"]
        upgrade:
          allowed: true
          until_quality: 1080p
          until_score: 2000 # a dub (+2000) or an English-tagged tiered release ends upgrades
        min_format_score: 0
        min_upgrade_format_score: 1
        qualities:
          - name: 1080p
            qualities: [Bluray-1080p, WEBDL-1080p, WEBRip-1080p]
          - name: Bluray-720p
          - name: WEB 720p
            qualities: [WEBDL-720p, WEBRip-720p]
          - name: HDTV-1080p
          - name: HDTV-720p
          - name: Bluray-576p
          - name: Bluray-480p
          - name: WEB 480p
            qualities: [WEBDL-480p, WEBRip-480p]
          - name: DVD
          - name: SDTV
          # Everything below is off: 4K, remuxes and discs (no 4K; Roku/phone can't play them),
          # DVD-R images, and the cam-era junk Goobs never wants.
          - name: Remux-2160p
            enabled: false
          - name: Bluray-2160p
            enabled: false
          - name: WEB 2160p
            enabled: false
            qualities: [WEBDL-2160p, WEBRip-2160p]
          - name: HDTV-2160p
            enabled: false
          - name: Remux-1080p
            enabled: false
          - name: BR-DISK
            enabled: false
          - name: Raw-HD
            enabled: false
          - name: DVD-R
            enabled: false
          - name: DVDSCR
            enabled: false
          - name: REGIONAL
            enabled: false
          - name: TELECINE
            enabled: false
          - name: TELESYNC
            enabled: false
          - name: CAM
            enabled: false
          - name: WORKPRINT
            enabled: false
          - name: Unknown
            enabled: false
    custom_formats:
      # The HD Bluray + WEB guide formats, for the user-defined foreign profile.
      - trash_ids:
          - c20f169ef63c5f40c2def54abaf4438e # WEB Tier 01
          - 403816d65392c79236dcb6dd591aeda4 # WEB Tier 02
          - af94e0fe497124d1f9ce732069ec8c3b # WEB Tier 03
          - e7718d7a3ce595f289bfee26adc178f5 # Repack/Proper
          - ae43b294509409a6a13919dedd4764c4 # Repack2
          - 5caaaa1c08c1742aa4342d8c4cc463f2 # Repack3
          # Home-lab formats from ../recyclarr-extra/custom-formats/radarr.
          - 03c8697a4963714a449ff7f3ef63c43a # Homelab: English Tag (+1000, title only)
          - f88d7ef98af0031394cdedfe46f92766 # Homelab: Dubbed or Dual Audio (+2000)
          - cf978d4b72de03a4773bee970890c94b # Homelab: Not Original or English (-10000)
        assign_scores_to:
          - name: *radarr_foreign
      # Tdarr re-encodes H.264 movies to HEVC (2026-10-21), so the TRaSH "x265 (HD)" penalty
      # (-10000) would make Radarr try to replace those files. Since 2026-10-23 it is a bonus:
      # an x265 release is grabbed already small and spares Tdarr the work.
      - trash_ids:
          - dc98083864ea246d05a42df0d05f81cc # x265 (HD)
        assign_scores_to:
          - name: *radarr_main
            score: 500
          - name: *radarr_foreign
            score: 500
      # Not for new grabs: the target is 8-bit HEVC (the iGPU can't decode 10-bit when a client
      # transcodes). Files already on disk are safe, see upgrade.until_score.
      - trash_ids:
          - a5d148168c4506b55cf53984107c396e # 10bit
        assign_scores_to:
          - name: *radarr_main
            score: -10000
          - name: *radarr_foreign
            score: -10000
      # WEB-DL over Bluray encodes (2026-10-23): the guide scores the Bluray tiers 1800/1750/1700,
      # above WEB Tier 01 (1700), and those groups make the biggest 1080p encodes. Each now sits
      # 200 below the matching WEB tier, still above untiered releases.
      - trash_ids:
          - ed27ebfef2f323e964fb1f61391bcb35 # HD Bluray Tier 01
        assign_scores_to:
          - name: *radarr_main
            score: 1500
          - name: *radarr_foreign
            score: 1500
      - trash_ids:
          - c20c8647f2746a1f4c4262b0fbbeeeae # HD Bluray Tier 02
        assign_scores_to:
          - name: *radarr_main
            score: 1450
          - name: *radarr_foreign
            score: 1450
      - trash_ids:
          - 5608c71bcebba0a5e666223bae8c9227 # HD Bluray Tier 03
        assign_scores_to:
          - name: *radarr_main
            score: 1400
          - name: *radarr_foreign
            score: 1400
    # Same rule as Sonarr: name the main profile on every group listed here.
    custom_format_groups:
      add:
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df # [Unwanted] Unwanted Formats
          assign_scores_to: [name: *radarr_main, name: *radarr_foreign]
        - trash_id: d9cc9a504e5ede6294c8b973aad4f028 # Streaming Services General
          assign_scores_to: [name: *radarr_main, name: *radarr_foreign]
