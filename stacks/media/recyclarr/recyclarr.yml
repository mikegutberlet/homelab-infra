# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
# TRaSH Guides quality profiles and custom formats, synced daily (Recyclarr 8).
# Same profiles as the TRaSH "web-1080p" (Sonarr) and "hd-bluray-web" (Radarr) templates;
# a profile's default custom-format groups come with it. Adjust after migrating the
# existing Sonarr/Radarr settings.
sonarr:
  sonarr: # v8: instance names must be unique across Sonarr and Radarr
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY
    quality_definition:
      type: series
    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        reset_unmatched_scores:
          enabled: true

radarr:
  radarr:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY
    quality_definition:
      type: movie
    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
