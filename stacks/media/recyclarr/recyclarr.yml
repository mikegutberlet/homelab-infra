# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
# TRaSH Guides quality profiles and custom formats, synced daily (Recyclarr 8).
# The TRaSH profiles are applied to Goobs's existing profiles by name (chosen 2026-10-21),
# so series/movies keep the profile they already use. Same profiles as the TRaSH
# "web-1080p" (Sonarr) and "hd-bluray-web" (Radarr) templates; a profile's default
# custom-format groups come with it.
# Both top out at 1080p (no 4K, by choice).
sonarr:
  sonarr: # v8: instance names must be unique across Sonarr and Radarr
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY
    quality_definition:
      type: series
    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        # The profile 538 of 541 series use (the name really ends with a space).
        name: "Anything Not Terrible "
        reset_unmatched_scores:
          enabled: true

radarr:
  radarr:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY
    quality_definition:
      type: movie
    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
        name: Anything Not terrible
        reset_unmatched_scores:
          enabled: true
    custom_formats:
      # Tdarr re-encodes H.264 movies to HEVC (2026-10-21), so the TRaSH "x265 (HD)" penalty
      # (-10000) would make Radarr try to replace those files. Score it 0 instead.
      - trash_ids:
          - dc98083864ea246d05a42df0d05f81cc # x265 (HD)
        assign_scores_to:
          - name: Anything Not terrible
            score: 0
