# ai VM (RicksShip). No local models yet: Ollama waits for the GTX 1660 Ti eGPU, so
# Open WebUI and AnythingLLM use Google Gemini (key in secrets.sops.env).

# mem_limit/cpus (2026-10-22): caps sit above each container's measured peak, so one runaway app
# gets restarted instead of starving the whole VM. Page cache counts toward the cap and is
# reclaimed first, so a cap below a cache-heavy peak (SABnzbd, Tdarr) is fine.

x-common: &common
  restart: unless-stopped
  labels:
    autoheal: "true"

services:
  open-webui:
    <<: *common
    image: ghcr.io/open-webui/open-webui:main
    mem_limit: 2g
    environment:
      # Trusts this header for login, so port 3010 must only be reachable by Traefik: the lanfw
      # role allows it from the edge VM (192.168.1.50) only (edge_only_ports on the ai host).
      WEBUI_AUTH_TRUSTED_EMAIL_HEADER: X-authentik-email
      OPENAI_API_BASE_URL: ${LLM_API_BASE_URL}
      OPENAI_API_KEY: ${LLM_API_KEY}
      ENABLE_OLLAMA_API: "false"
      DEFAULT_MODELS: models/gemini-flash-latest # Gemini (OpenAI-compatible endpoint); alias for the current Flash
    ports: ["3010:8080"]
    volumes:
      - /opt/appdata/open-webui:/app/backend/data

  anythingllm:
    <<: *common
    image: mintplexlabs/anythingllm:latest
    mem_limit: 1536m
    cap_add: [SYS_ADMIN]
    environment:
      STORAGE_DIR: /app/server/storage
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${LLM_API_KEY}
      GEMINI_LLM_MODEL_PREF: gemini-flash-latest # gemini-2.5-flash is closed to new accounts
      VECTOR_DB: pgvector
      PGVECTOR_CONNECTION_STRING: postgresql://ai:${AI_DB_PASSWORD}@192.168.1.53:5432/ai
    ports: ["3011:3001"]
    volumes:
      - /opt/appdata/anythingllm:/app/server/storage

  # Text to speech over the Wyoming protocol (port 10200).
  piper:
    <<: *common
    image: rhasspy/wyoming-piper:latest
    command: --voice en_US-lessac-medium
    ports: ["10200:10200"]
    volumes:
      - /opt/appdata/piper:/data

  # LangChain + CrewAI as a long-running worker that n8n can call over HTTP.
  worker:
    <<: *common
    build: ./worker
    environment:
      LLM_API_BASE_URL: ${LLM_API_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      PGVECTOR_URL: postgresql://ai:${AI_DB_PASSWORD}@192.168.1.53:5432/ai
    ports: ["8100:8100"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      retries: 3

  # Reports new image versions to the n8n digest on the apps VM; updates nothing itself
  # (ansible role ops auto-updates the hosts.yml auto_update list weekly).
  diun:
    <<: *common
    image: crazymax/diun:4
    command: serve
    hostname: ai # Diun names the host it watches by its own hostname (else the container id)
    environment:
      TZ: ${TZ}
      DIUN_WATCH_SCHEDULE: "0 */6 * * *"
      DIUN_PROVIDERS_DOCKER: "true"
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: "true"
      DIUN_NOTIF_WEBHOOK_ENDPOINT: http://192.168.1.53:5678/webhook/homelab/diun # daily digest (n8n)
      DIUN_NOTIF_WEBHOOK_METHOD: POST
      DIUN_NOTIF_WEBHOOK_HEADERS_CONTENT-TYPE: application/json # Diun sets none; n8n then sees an empty body
    volumes:
      - /opt/appdata/diun:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
