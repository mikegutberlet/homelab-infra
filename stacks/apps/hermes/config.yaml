# Seed for /opt/appdata/hermes/config.yaml (copied once by hermes/init.sh; Hermes owns it after that,
# so /model and `hermes config set` changes stick). Secrets never live here: they come from the
# container environment (compose.yaml, apps secrets).
model:
  provider: anthropic
  default: claude-opus-5-5
terminal:
  backend: local # inside the container; the lab VMs are reached read-only over ssh (skill homelab)
  cwd: /opt/data
skills:
  auto_load: [homelab, caveman]
memory:
  memory_enabled: true
# REA (github.com/morluto/rea, MIT): reverse-engineering MCP server, added by `npx rea-agents@6.8.0 setup
# --client hermes`, which also installs the reverse-engineer-anything skill into the data folder.
# A refresh (`npx rea-agents@latest setup --client hermes`) re-pins the version in the live config.
mcp_servers:
  rea:
    command: npx
    args: [-y, rea-agents@6.8.0, mcp]
    enabled: true
