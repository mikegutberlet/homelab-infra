# Every app on the five VMs. Links go through Tailscale (https://<app>.<tailnet>); siteMonitor
# and the widgets talk to the LAN address from the apps VM, which the lanfw firewall allows
# (lab VMs .50-.54 reach every published port).
#
# Widget credentials come from the apps stack secrets (secrets.sops.env) as HOMEPAGE_VAR_*
# environment variables on the homepage container; see compose.yaml. A widget whose variable
# is still empty shows an error tile but the link and the status dot keep working.
- Watch:
    - Plex:
        href: "https://plex.{{HOMEPAGE_VAR_TAILNET}}/web"
        description: Movies and TV (gpu VM)
        icon: plex.png
        siteMonitor: "http://192.168.1.52:32400/identity"
        widget:
          type: plex
          url: "http://192.168.1.52:32400"
          key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
    - Emby:
        href: "https://emby.{{HOMEPAGE_VAR_TAILNET}}"
        description: Movies and TV (gpu VM)
        icon: emby.png
        siteMonitor: "http://192.168.1.52:8096/emby/System/Ping"
        widget:
          type: emby
          url: "http://192.168.1.52:8096"
          key: "{{HOMEPAGE_VAR_EMBY_KEY}}"
          enableBlocks: true
          enableNowPlaying: true
    - Home rows:
        href: "http://192.168.1.52:8097/health"
        description: Curated Plex and Emby rows (Kometa 5 am, Emby copy 7 am)
        icon: mdi-view-carousel
        siteMonitor: "http://192.168.1.52:8097/health"
    - Requests:
        href: "https://requests.{{HOMEPAGE_VAR_TAILNET}}"
        description: Jellyseerr, ask for a movie or show
        icon: jellyseerr.png
        siteMonitor: "http://192.168.1.51:5055/api/v1/status"
        widget:
          type: jellyseerr
          url: "http://192.168.1.51:5055"
          key: "{{HOMEPAGE_VAR_JELLYSEERR_KEY}}"
    - ErsatzTV:
        href: "https://ersatztv.{{HOMEPAGE_VAR_TAILNET}}"
        description: Live TV channels from the library
        icon: ersatztv.png
        siteMonitor: "http://192.168.1.52:8409/"
    - Photos:
        href: "https://photos.{{HOMEPAGE_VAR_TAILNET}}"
        description: Immich
        icon: immich.png
        siteMonitor: "http://192.168.1.52:2283/api/server/ping"
        widget:
          type: immich
          url: "http://192.168.1.52:2283"
          key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
          version: 2
    - Audiobooks:
        href: "https://audiobooks.{{HOMEPAGE_VAR_TAILNET}}"
        description: Audiobookshelf
        icon: audiobookshelf.png
        siteMonitor: "http://192.168.1.51:13378/healthcheck"
        widget:
          type: audiobookshelf
          url: "http://192.168.1.51:13378"
          key: "{{HOMEPAGE_VAR_AUDIOBOOKSHELF_KEY}}"
    - Storyteller:
        href: "https://storyteller.{{HOMEPAGE_VAR_TAILNET}}"
        description: Ebooks synced with audiobooks
        icon: mdi-book-open-page-variant
        siteMonitor: "http://192.168.1.51:8001/"
    - RomM:
        href: "https://romm.{{HOMEPAGE_VAR_TAILNET}}"
        description: Retro games
        icon: romm.png
        siteMonitor: "http://192.168.1.51:8095/api/heartbeat"
        widget:
          type: romm
          url: "http://192.168.1.51:8095"
          username: "{{HOMEPAGE_VAR_ROMM_USER}}"
          password: "{{HOMEPAGE_VAR_ROMM_PASSWORD}}"
          fields: [platforms, totalRoms, saves, states]
    - MeTube:
        href: "https://metube.{{HOMEPAGE_VAR_TAILNET}}"
        description: Download videos from the web
        icon: metube.png
        siteMonitor: "http://192.168.1.51:8081/"

