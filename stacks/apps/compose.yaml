# apps VM (RicksShip): personal cloud, documents, automation, and the ops tools.
# Monitoring lives here, on the other host from TrueNAS and the edge VM, so it can
# still alert when RicksGarage is down.

# mem_limit/cpus (2026-10-22): caps sit above each container's measured peak, so one runaway app
# gets restarted instead of starving the whole VM. Page cache counts toward the cap and is
# reclaimed first, so a cap below a cache-heavy peak (SABnzbd, Tdarr) is fine.

x-common: &common
  restart: unless-stopped
  labels:
    autoheal: "true"

services:
  # One Postgres for Nextcloud, Paperless, n8n and Huginn (and pgvector for the ai VM),
  # each with its own database and user (postgres/init.sql).
  postgres:
    <<: *common
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NEXTCLOUD_DB_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      PAPERLESS_DB_PASSWORD: ${PAPERLESS_DB_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      HUGINN_DB_PASSWORD: ${HUGINN_DB_PASSWORD}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
    ports: ["5432:5432"] # the ai VM uses pgvector; Proxmox firewall limits this to 192.168.1.54
    volumes:
      - /opt/appdata/postgres:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      retries: 5

  redis:
    <<: *common
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s

  nextcloud:
    <<: *common
    image: nextcloud:31-fpm
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      REDIS_HOST: redis
      # The LAN IP is trusted too, for Uptime Kuma/Homepage health checks (only applies on a fresh
      # install; the running instance got it via occ config:system:set on 2026-10-21).
      NEXTCLOUD_TRUSTED_DOMAINS: cloud.${TS_TAILNET} 192.168.1.53
      TRUSTED_PROXIES: 192.168.1.50
      OVERWRITEPROTOCOL: https
    volumes:
      - /opt/appdata/nextcloud/html:/var/www/html
      # NAS/Media/NextCloud is owned by www-data (33:33, 0770) on TrueNAS since 2026-10-21;
      # Nextcloud refuses a data dir that other users can read.
      - /mnt/nfs/Media/NextCloud:/var/www/html/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # Internal web server for Nextcloud only; Traefik on the edge VM is the reverse proxy.
  nextcloud-web:
    <<: *common
    image: nginx:1.27-alpine
    ports: ["8090:80"]
    volumes:
      - ./nextcloud/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/appdata/nextcloud/html:/var/www/html:ro
    depends_on: [nextcloud]

  nextcloud-cron:
    <<: *common
    image: nextcloud:31-fpm
    entrypoint: /cron.sh
    volumes:
      - /opt/appdata/nextcloud/html:/var/www/html
      - /mnt/nfs/Media/NextCloud:/var/www/html/data
    depends_on: [nextcloud]

  paperless:
    <<: *common
    image: ghcr.io/paperless-ngx/paperless-ngx:2.20 # no floating ":2" tag is published
    mem_limit: 2g
    environment:
      USERMAP_UID: ${PUID}
      USERMAP_GID: ${PGID}
      PAPERLESS_TIME_ZONE: ${TZ}
      PAPERLESS_REDIS: redis://redis:6379/1
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_URL: https://paperless.${TS_TAILNET}
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
    ports: ["8000:8000"]
    volumes:
      - /opt/appdata/paperless/data:/usr/src/paperless/data
      # NAS/Documents/Paperless/{consume,media,export}, 3000:3000 (created 2026-10-21).
      - /mnt/nfs/Documents/Paperless/media:/usr/src/paperless/media
      - /mnt/nfs/Documents/Paperless/consume:/usr/src/paperless/consume
      - /mnt/nfs/Documents/Paperless/export:/usr/src/paperless/export
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  gotenberg:
    <<: *common
    image: gotenberg/gotenberg:8
    command: ["gotenberg", "--chromium-disable-javascript=true", "--chromium-allow-list=file:///tmp/.*"]

  tika:
    <<: *common
    image: apache/tika:latest
    mem_limit: 1g

  stirling-pdf:
    <<: *common
    image: stirlingtools/stirling-pdf:latest
    mem_limit: 2g
    environment:
      DOCKER_ENABLE_SECURITY: "false" # Authentik handles login
    ports: ["8070:8080"]
    volumes:
      - /opt/appdata/stirling-pdf:/configs

  n8n:
    <<: *common
    image: docker.n8n.io/n8nio/n8n:latest
    mem_limit: 1536m
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: n8n.${TS_TAILNET}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${TS_TAILNET}/
      GENERIC_TIMEZONE: ${TZ}
    ports: ["5678:5678"]
    volumes:
      # Runs as the image's own "node" user (1000): parts of n8n ignore HOME and write
      # /home/node/.cache, so another uid fails. Data folder is 1000:1000 (appdata_dir_owners).
      - /opt/appdata/n8n:/home/node/.n8n
    depends_on:
      postgres: {condition: service_healthy}

  # Chat page for the n8n sysadmin (sysadmin.<tailnet>, behind Authentik): a static page plus a
  # proxy to the workflow's chat webhook. The webhook token lives in token.env (written by
  # docs/sysadmin_deploy.py, never in the repo) and is added server-side, so the browser never sees it.
  sysadmin-chat:
    <<: *common
    image: nginx:1.27-alpine
    environment:
      NGINX_ENVSUBST_FILTER: ^CHAT_TOKEN$$ # only this variable is substituted into the template
    env_file:
      - {path: /opt/appdata/sysadmin-chat/token.env, required: false}
    ports: ["3003:80"]
    volumes:
      - ./sysadmin-chat/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./sysadmin-chat/00-chat-token.envsh:/docker-entrypoint.d/00-chat-token.envsh:ro
      - ./sysadmin-chat/index.html:/usr/share/nginx/html/index.html:ro
    depends_on: [n8n]

  huginn:
    <<: *common
    image: ghcr.io/huginn/huginn:latest
    mem_limit: 1536m
    environment:
      DATABASE_ADAPTER: postgresql
      DATABASE_HOST: postgres
      DATABASE_NAME: huginn
      DATABASE_USERNAME: huginn
      DATABASE_PASSWORD: ${HUGINN_DB_PASSWORD}
      APP_SECRET_TOKEN: ${HUGINN_SECRET_TOKEN}
      # Postgres' init.sh already creates the database; the huginn user can't CREATE DATABASE.
      DO_NOT_CREATE_DATABASE: "true"
      # First-start seed creates this admin instead of the default admin/password.
      SEED_USERNAME: admin
      SEED_PASSWORD: ${HUGINN_ADMIN_PASSWORD}
      SEED_EMAIL: admin@huginn.invalid
      TIMEZONE: ${TZ}
    ports: ["3000:3000"]
    depends_on:
      postgres: {condition: service_healthy}

  # Plex statistics (moved from the old Plex VM's snap, 2026-10-21).
  tautulli:
    <<: *common
    image: lscr.io/linuxserver/tautulli:latest
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    ports: ["8181:8181"]
    volumes:
      - /opt/appdata/tautulli:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8181/status"]
      interval: 60s
      retries: 3
      start_period: 60s

  # --- ops tools ---
  homepage:
    <<: *common
    image: ghcr.io/gethomepage/homepage:v1
    environment:
      HOMEPAGE_ALLOWED_HOSTS: home.${TS_TAILNET}
      HOMEPAGE_VAR_TAILNET: ${TS_TAILNET} # used by homepage/services.yaml links
      # Widget credentials (homepage/services.yaml). Read-only keys from the app configs,
      # kept in secrets.sops.env; an empty one only breaks that app's tile.
      HOMEPAGE_VAR_SONARR_KEY: ${HOMEPAGE_SONARR_KEY}
      HOMEPAGE_VAR_RADARR_KEY: ${HOMEPAGE_RADARR_KEY}
      HOMEPAGE_VAR_PROWLARR_KEY: ${HOMEPAGE_PROWLARR_KEY}
      HOMEPAGE_VAR_BAZARR_KEY: ${HOMEPAGE_BAZARR_KEY}
      HOMEPAGE_VAR_SABNZBD_KEY: ${HOMEPAGE_SABNZBD_KEY}
      HOMEPAGE_VAR_QBITTORRENT_USER: ${HOMEPAGE_QBITTORRENT_USER}
      HOMEPAGE_VAR_QBITTORRENT_PASSWORD: ${HOMEPAGE_QBITTORRENT_PASSWORD}
      HOMEPAGE_VAR_JELLYSEERR_KEY: ${HOMEPAGE_JELLYSEERR_KEY}
      HOMEPAGE_VAR_PLEX_TOKEN: ${HOMEPAGE_PLEX_TOKEN}
      HOMEPAGE_VAR_EMBY_KEY: ${HOMEPAGE_EMBY_KEY}
      HOMEPAGE_VAR_TAUTULLI_KEY: ${HOMEPAGE_TAUTULLI_KEY}
      HOMEPAGE_VAR_TDARR_KEY: ${HOMEPAGE_TDARR_KEY}
      HOMEPAGE_VAR_IMMICH_KEY: ${HOMEPAGE_IMMICH_KEY}
      HOMEPAGE_VAR_AUDIOBOOKSHELF_KEY: ${HOMEPAGE_AUDIOBOOKSHELF_KEY}
      HOMEPAGE_VAR_ROMM_USER: ${HOMEPAGE_ROMM_USER}
      HOMEPAGE_VAR_ROMM_PASSWORD: ${HOMEPAGE_ROMM_PASSWORD}
      HOMEPAGE_VAR_NEXTCLOUD_TOKEN: ${HOMEPAGE_NEXTCLOUD_TOKEN}
      HOMEPAGE_VAR_PAPERLESS_TOKEN: ${HOMEPAGE_PAPERLESS_TOKEN}
      HOMEPAGE_VAR_PROXMOX_TOKEN_ID: ${HOMEPAGE_PROXMOX_TOKEN_ID}
      HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET: ${HOMEPAGE_PROXMOX_TOKEN_SECRET}
      HOMEPAGE_VAR_TRUENAS_KEY: ${HOMEPAGE_TRUENAS_KEY}
    ports: ["3001:3000"]
    volumes:
      - ./homepage:/app/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--header=Host: home.${TS_TAILNET}", "http://localhost:3000/api/healthcheck"]
      interval: 60s
      retries: 3
      start_period: 60s

  uptime-kuma:
    <<: *common
    image: louislam/uptime-kuma:2 # 1.x is unsupported; v2 migrates the v1 kuma.db on first start
    ports: ["3002:3001"]
    volumes:
      - /opt/appdata/uptime-kuma:/app/data

  # Scrutiny hub; collectors run on both Proxmox hosts, which can read the disks' SMART data.
  scrutiny:
    <<: *common
    image: ghcr.io/analogj/scrutiny:v0.9.5-web # same release as the host collectors (proxmox-scrutiny.yml)
    ports: ["8087:8080"]
    environment:
      SCRUTINY_WEB_INFLUXDB_HOST: scrutiny-influx
      # Disk warnings go to the n8n daily digest (shoutrrr generic webhook, plain http).
      SCRUTINY_NOTIFY_URLS: '["generic://n8n:5678/webhook/homelab/scrutiny?disabletls=yes&template=json"]'
    volumes:
      - /opt/appdata/scrutiny/config:/opt/scrutiny/config
    depends_on: [scrutiny-influx]

  scrutiny-influx:
    <<: *common
    image: influxdb:2.7
    volumes:
      - /opt/appdata/scrutiny/influxdb:/var/lib/influxdb2

  # Watches images on every VM and posts new versions to n8n; nothing updates itself.
  diun:
    <<: *common
    image: crazymax/diun:4
    command: serve
    environment:
      TZ: ${TZ}
      DIUN_WATCH_SCHEDULE: "0 */6 * * *"
      DIUN_PROVIDERS_DOCKER: "true"
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: "true"
      DIUN_NOTIF_WEBHOOK_ENDPOINT: http://n8n:5678/webhook/homelab/diun # daily digest (n8n)
      DIUN_NOTIF_WEBHOOK_METHOD: POST
    volumes:
      - /opt/appdata/diun:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Buttons for a fixed list of maintenance commands (olivetin/config.yaml). Nothing else.
  olivetin:
    <<: *common
    image: jamesread/olivetin:latest
    ports: ["1337:1337"]
    volumes:
      - ./olivetin:/config:ro

  dockge:
    <<: *common
    image: louislam/dockge:1
    environment:
      DOCKGE_STACKS_DIR: /opt/stacks
    ports: ["5001:5001"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/appdata/dockge:/app/data
      - /opt/stacks:/opt/stacks

  # --- metrics and trend graphs (2026-10-23) ---
  # Prometheus keeps the history, Grafana draws it. Alerting stays in Kuma and the n8n digest;
  # Grafana has no contact points. Every VM runs node-exporter and cAdvisor (role metrics); the
  # exporters for Proxmox, the arr apps and TrueNAS run here. Targets: prometheus/prometheus.yml.
  prometheus:
    <<: *common
    image: prom/prometheus:v3.15.1
    mem_limit: 1g
    user: ${PUID}:${PGID}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # ~25k series at a 30 s scrape is ~100 MB a day; whichever limit comes first wins.
      - --storage.tsdb.retention.time=180d
      - --storage.tsdb.retention.size=15GB
      - --web.enable-lifecycle # POST /-/reload after a config change
    ports: ["9090:9090"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - /opt/appdata/prometheus:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 60s
      retries: 3

  # Signed in by Authentik only: Traefik's forward auth adds X-authentik-username, and the port
  # accepts connections from the edge VM alone (edge_only_ports), like Open WebUI. akadmin is the
  # Grafana admin; any other Authentik user gets a read-only Viewer account.
  grafana:
    <<: *common
    image: grafana/grafana:13.2.4
    mem_limit: 512m
    user: ${PUID}:${PGID}
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${TS_TAILNET}/
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-authentik-username
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_HEADERS: Email:X-authentik-email
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_WHITELIST: 192.168.1.50
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: akadmin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD} # never used to log in; the form is off
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false" # Diun watches the image
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false" # alerts stay in Kuma and n8n
    ports: ["3004:3000"]
    volumes:
      - /opt/appdata/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro
    depends_on: [prometheus]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 60s
      retries: 3
      start_period: 60s

  # Proxmox API (read-only token prometheus@pve!prometheus, role PVEAuditor). One target covers
  # the whole cluster; prometheus.yml asks each host for its own node data.
  pve-exporter:
    <<: *common
    image: prompve/prometheus-pve-exporter:3.10.1
    mem_limit: 128m
    environment:
      PVE_USER: prometheus@pve
      PVE_TOKEN_NAME: prometheus
      PVE_TOKEN_VALUE: ${PVE_EXPORTER_TOKEN}
      PVE_VERIFY_SSL: "false" # the hosts' self-signed certificates

  # Arr and SABnzbd counters (library size, missing, queue, speed). Reuses Homepage's API keys.
  # Without ENABLE_ADDITIONAL_METRICS each scrape is a handful of API calls.
  exportarr-sonarr:
    <<: *common
    image: ghcr.io/onedr0p/exportarr:v2.3.0
    command: [sonarr]
    mem_limit: 128m
    environment: {PORT: 9707, URL: "http://192.168.1.51:8989", APIKEY: "${HOMEPAGE_SONARR_KEY}"}
  exportarr-radarr:
    <<: *common
    image: ghcr.io/onedr0p/exportarr:v2.3.0
    command: [radarr]
    mem_limit: 128m
    environment: {PORT: 9708, URL: "http://192.168.1.51:7878", APIKEY: "${HOMEPAGE_RADARR_KEY}"}
  exportarr-prowlarr:
    <<: *common
    image: ghcr.io/onedr0p/exportarr:v2.3.0
    command: [prowlarr]
    mem_limit: 128m
    environment: {PORT: 9709, URL: "http://192.168.1.51:9696", APIKEY: "${HOMEPAGE_PROWLARR_KEY}"}
  exportarr-sabnzbd:
    <<: *common
    image: ghcr.io/onedr0p/exportarr:v2.3.0
    command: [sabnzbd]
    mem_limit: 128m
    environment: {PORT: 9710, URL: "http://192.168.1.51:8080", APIKEY: "${HOMEPAGE_SABNZBD_KEY}"}

  # TrueNAS SCALE pushes its netdata reporting here in Graphite format (System > Reporting >
  # Exporters on the NAS); the exporter turns it into Prometheus metrics. Only the NAS may send
  # (lanfw_extra_allow).
  graphite-exporter:
    <<: *common
    image: prom/graphite-exporter:v0.17.0
    mem_limit: 128m
    command:
      - --graphite.mapping-config=/etc/graphite/mapping.yml
      - --graphite.sample-expiry=5m
    ports: ["2003:9109"] # Graphite plaintext over TCP
    volumes:
      - ./prometheus/graphite-mapping.yml:/etc/graphite/mapping.yml:ro

  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
