<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homelab Sysadmin</title>
<meta name="theme-color" content="#111418">
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #dfe3e8;
    --me: #2f6feb; --me-text: #ffffff; --bot: #ffffff; --accent: #2f6feb;
    --warn-bg: #fff6e0; --warn-line: #e9b949; --ok: #1f883d; --bad: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --panel: #191d23; --text: #e6e9ee; --muted: #9aa4b2; --line: #2b313a;
      --me: #2f6feb; --me-text: #ffffff; --bot: #1f242b; --accent: #6ea8fe;
      --warn-bg: #2d2614; --warn-line: #a8811f; --ok: #3fb950; --bad: #f85149;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; flex-direction: column; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header span { color: var(--muted); font-size: 13px; }
  header button { margin-left: auto; }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 10px 13px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--me); color: var(--me-text); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .note { align-self: center; color: var(--muted); font-size: 13px; }
  .card { align-self: flex-start; max-width: 88%; background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 12px; padding: 10px 13px; }
  .card code { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .card .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .card small { color: var(--muted); display: block; margin-top: 4px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; min-height: 42px; max-height: 140px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>Homelab sysadmin</h1><span>answers from the lab's live state; fixes only on Confirm</span>
  <button id="clear" type="button" title="Start a new conversation">New chat</button>
</header>
<main id="log"><div class="wrap" id="wrap"></div></main>
<footer>
  <form id="f">
    <textarea id="q" rows="1" placeholder="Ask about the lab..." autofocus></textarea>
    <button class="primary" id="send">Send</button>
  </form>
</footer>
<script>
const wrap = document.getElementById('wrap'), log = document.getElementById('log');
const q = document.getElementById('q'), send = document.getElementById('send');
const STARTERS = ['What needs my attention?', 'What was fixed or would have been fixed today?', 'How full is the NAS?', 'Are all backups current?', 'Is qBittorrent behind the VPN?'];
// The session id keys the agent's memory in n8n; "New chat" starts a fresh one.
let history = [], sessionId = '';
try { history = JSON.parse(sessionStorage.getItem('chat') || '[]'); sessionId = sessionStorage.getItem('chat-session') || ''; } catch (e) { history = []; }
const newSession = () => { sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2)).replace(/-/g, ''); try { sessionStorage.setItem('chat-session', sessionId); } catch (e) {} };
if (!sessionId) newSession();
const save = () => { try { sessionStorage.setItem('chat', JSON.stringify(history.slice(-30))); } catch (e) {} };

function add(cls, text) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
  wrap.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function note(text, cls) {
  const d = document.createElement('div'); d.className = 'note ' + (cls || ''); d.textContent = text;
  wrap.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function starters() {
  const c = document.createElement('div'); c.className = 'chips';
  for (const s of STARTERS) { const b = document.createElement('button'); b.type = 'button'; b.textContent = s; b.onclick = () => ask(s); c.appendChild(b); }
  wrap.appendChild(c);
}
function card(p) {
  const d = document.createElement('div'); d.className = 'card';
  const t = document.createElement('div');
  t.innerHTML = 'Proposed fix on <b></b>: <code></code>';
  t.querySelector('b').textContent = p.host; t.querySelector('code').textContent = p.cmd;
  const why = document.createElement('small'); why.textContent = p.reason;
  const exp = document.createElement('small');
  exp.textContent = p.enabled ? `Runs only if you press Confirm (expires in ${p.expires_min} min).` : 'Chat fixes are switched off, so this is a suggestion only.';
  d.append(t, why, exp);
  if (p.enabled) {
    const row = document.createElement('div'); row.className = 'row';
    const yes = document.createElement('button'); yes.className = 'primary'; yes.type = 'button'; yes.textContent = 'Confirm';
    const no = document.createElement('button'); no.type = 'button'; no.textContent = 'Cancel';
    yes.onclick = () => { yes.disabled = no.disabled = true; act({ confirm: p.n }, `Confirmed: ${p.cmd} on ${p.host}`); };
    no.onclick = () => { yes.disabled = no.disabled = true; act({ cancel: p.n }, 'Cancelled'); };
    row.append(yes, no); d.appendChild(row);
  }
  wrap.appendChild(d); log.scrollTop = log.scrollHeight;
}

async function call(body) {
  const r = await fetch('api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...body, sessionId }), credentials: 'same-origin' });
  if (r.status === 401 || r.status === 403) throw new Error(`the chat webhook refused the request (${r.status}); the token on the apps VM and in n8n may not match`);
  if (!r.ok) throw new Error(`n8n answered ${r.status}`);
  return r.json();
}
function busy(on) { send.disabled = on; q.disabled = on; if (!on) q.focus(); }

async function ask(text) {
  text = (text || '').trim(); if (!text) return;
  add('user', text); q.value = ''; busy(true);
  const wait = note('Thinking...');
  try {
    const res = await call({ message: text });
    wait.remove(); add('bot', res.text || '(no answer)');
    history.push({ role: 'user', text }, { role: 'assistant', text: res.text || '' }); save();
    if (res.proposal) card(res.proposal);
  } catch (e) { wait.remove(); note('Could not reach the sysadmin: ' + e.message, 'bad'); }
  busy(false);
}
async function act(body, label) {
  note(label); busy(true);
  const wait = note('Working...');
  try {
    const res = await call(body);
    wait.remove(); add('bot', res.text || '(no answer)');
    history.push({ role: 'assistant', text: res.text || '' }); save();
  } catch (e) { wait.remove(); note('Could not reach the sysadmin: ' + e.message, 'bad'); }
  busy(false);
}

document.getElementById('f').onsubmit = (e) => { e.preventDefault(); ask(q.value); };
q.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(q.value); } });
q.addEventListener('input', () => { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 140) + 'px'; });
document.getElementById('clear').onclick = () => { history = []; save(); newSession(); wrap.innerHTML = ''; starters(); };

for (const m of history) add(m.role === 'user' ? 'user' : 'bot', m.text);
if (!history.length) { add('bot', 'Hi Goobs. Ask me anything about the lab: open issues, backups, disks, downloads, a container\'s logs. If something needs fixing I\'ll suggest one of the safe fixes, and it runs only when you press Confirm.'); starters(); }
</script>
</body>
</html>
