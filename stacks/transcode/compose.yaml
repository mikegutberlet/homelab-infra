# transcode VM (RicksPortalGun, 192.168.1.55): a second Tdarr node on that NUC's Iris Plus 655
# (passed through like the gpu VM's iGPU). It joins the Tdarr server on the gpu VM, runs the same
# flow and library schedule (17:00-23:00 PT pause), and halves the TV backlog. Retire it when
# Tdarr is done. Its only secret is the Tdarr server's API key (the server has auth on, so a node
# without it gets 401): TDARR_API_KEY in secrets.sops.env, the same key as the gpu VM's
# /root/tdarr-api-key. Other values are written out here.
#
# The flow reads /app/configs/hevc (flow.js, radarr/sonarr maps and API keys) on the node that
# runs it, so that folder is a copy of the gpu VM's /opt/appdata/tdarr/configs/hevc; refresh it
# whenever the maps or flow.js change there (docs/wiki/operations/portalgun-moves.md). The run
# log of this node's files is this VM's /opt/appdata/tdarr-node/logs/hevc-run.tsv.

x-common: &common
  restart: unless-stopped
  labels:
    autoheal: "true"

services:
  tdarr-node:
    <<: *common
    # A node must match the server's version exactly or it exits ("Node version 3.03.00 does not
    # match Server version 3.01.00", 2026-10-27). The server runs :latest as pulled on the gpu VM;
    # when it is updated, bump this tag to the same version.
    image: ghcr.io/haveagitgat/tdarr_node:3.01.00
    mem_limit: 4g
    cpus: 4
    environment:
      PUID: "3000"
      PGID: "3000"
      TZ: America/Los_Angeles
      serverIP: 192.168.1.52 # gpu VM; its lanfw allows this VM on 8266 (hosts.yml)
      serverPort: 8266
      inContainer: "true"
      nodeName: transcode-vm
      apiKey: ${TDARR_API_KEY}
    devices: [/dev/dri:/dev/dri]
    # Docker copies the /dev/dri nodes that exist when the container starts. After the 2026-10-27
    # power cycle it started before the iGPU's renderD128 appeared, saw only card0, and failed
    # 3,514 encodes in 0 s overnight. Unhealthy without the render node, so autoheal restarts it.
    healthcheck:
      test: ["CMD-SHELL", "test -e /dev/dri/renderD128"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 60s
    group_add: ["1000"] # same reason as on the gpu VM: 870 movie folders are goobs:goobs 0775
    volumes:
      - /opt/appdata/tdarr-node/configs:/app/configs
      - ./tdarr-init:/custom-cont-init.d:ro
      - /opt/appdata/tdarr-node/logs:/app/logs
      - /opt/appdata/transcode/tdarr:/temp # local disk, never NFS; same /temp as the library's cache setting
      # Same paths as the server, so no path translation is needed.
      - /mnt/nfs/Media:/mnt/nfs/Media
      - /mnt/nfs/to-delete:/mnt/nfs/to-delete

  diun:
    <<: *common
    image: crazymax/diun:4
    command: serve
    hostname: transcode # Diun names the host it watches by its own hostname (else the container id)
    environment:
      TZ: America/Los_Angeles
      DIUN_WATCH_SCHEDULE: "0 */6 * * *"
      DIUN_PROVIDERS_DOCKER: "true"
      DIUN_PROVIDERS_DOCKER_ENDPOINT: tcp://socket-proxy:2375
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: "true"
      DIUN_NOTIF_WEBHOOK_ENDPOINT: http://192.168.1.53:5678/webhook/homelab/diun # daily digest (n8n)
      DIUN_NOTIF_WEBHOOK_METHOD: POST
      DIUN_NOTIF_WEBHOOK_HEADERS_CONTENT-TYPE: application/json # Diun sets none; n8n then sees an empty body
    volumes:
      - /opt/appdata/diun:/data

  # Docker API for Diun (2026-10-28, security plan step 11). Diun used to mount
  # /var/run/docker.sock, which is root on the VM (a read-only mount still allows every API call).
  # The proxy passes only reads of containers, images, events and info; everything else gets 403.
  # Not read-only: the image writes haproxy.cfg at start. autoheal keeps the socket: 1.2.0 can't
  # talk plain tcp:// (it rewrites it to https and requires the socket file), and the only image
  # that can is the untagged :latest.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      EVENTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
