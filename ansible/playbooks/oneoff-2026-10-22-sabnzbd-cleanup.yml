# One-off, 2026-10-22, media VM. Kept for the record; safe to re-run (every step checks first).
#
#   ansible-playbook playbooks/oneoff-2026-10-22-sabnzbd-cleanup.yml
#   ansible-playbook playbooks/oneoff-2026-10-22-sabnzbd-cleanup.yml -e radarr_cleanup=true
#
# 1. Undo a bad Sonarr manual import: a ManualImport for "Icons Unearthed" (series 725) was fed
#    the series' own Season 1 files instead of the download, so Sonarr moved S01E01-06 into
#    Season 9 as S09E01-06 and told SABnzbd to delete the real S09 download. Move the six files
#    back to the paths Sonarr still holds for Season 1, rescan, and search Season 9 again.
# 2. Deletes Goobs approved in the thread ("yes", 16:36 UTC): MobLand S02E05 (not an upgrade;
#    removed through Sonarr so SABnzbd deletes the files), test_download_100MB, and the old
#    /mnt/nfs/sabnzb/incomplete folder (orphans, SABnzbd no longer points there).
# 3. SABnzbd duplicate detection off: no_dupes=1 / no_smart_dupes=1 ("Discard") made SABnzbd
#    silently drop every NZB it had seen before and return no job id, which Sonarr/Radarr log as
#    a grab failure with an empty error (hundreds today). The Arr apps decide what to grab, so
#    SABnzbd's own check only gets in the way (Servarr wiki recommendation).
# 4. Only with radarr_cleanup=true: drop the three Radarr queue items that are not import
#    problems (two not upgrades, one matched to the wrong movie), blocklisted, files removed.
- name: Sonarr fix and approved SABnzbd cleanup
  hosts: media
  become: true
  vars:
    radarr_cleanup: false
    sonarr_series_id: 725
    mobland_queue_id: 396472565
    old_incomplete: /mnt/nfs/sabnzb/incomplete
    complete_dir: /mnt/nfs/sabnzb/complete
    radarr_titles: ["The.Last.Fiction.2019", "28.Years.Later.The.Bone.Template.2026", "A.Very.Harold"]
    # The NFS export squashes root (mv/rm as root fail with "Permission denied"), so every write
    # under /mnt/nfs runs as the app user, the same way the containers do.
    nas_user: "{{ app_user }}"
    icons_dir: "/mnt/nfs/Media/TVShows/Icons Unearthed (2022)"
    icons_prefix: "Icons Unearthed (2022) - "
    icons_suffix: " WEBRip-1080p.mkv"
    # Names as Sonarr held them before the bad import (its old S01 episodefile records).
    icons_renames:
      - { from: "S09E01 - The Kids Are In Charge", to: "S01E01 - A New Hope Part I" }
      - { from: "S09E02 - A Race to the Finish", to: "S01E02 - A New Hope Part II" }
      - { from: "S09E03 - A Dark Turn", to: "S01E03 - The Empire Strikes Back" }
      - { from: "S09E04 - A Hero Unprepared", to: "S01E04 - Return of the Jedi" }
      - { from: "S09E05 - Growing Up", to: "S01E05 - The Phantom Menace" }
      - { from: "S09E06 - Pushing the Boundaries", to: "S01E06 - Attack of the Clones Revenge of the Sith" }
  tasks:
    - name: API keys
      ansible.builtin.shell: |
        echo "sonarr=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' {{ appdata_root }}/sonarr/config.xml | head -1)"
        echo "radarr=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' {{ appdata_root }}/radarr/config.xml | head -1)"
      register: keys
      changed_when: false
      no_log: true

    - name: Keys as facts
      ansible.builtin.set_fact:
        sonarr_key: "{{ keys.stdout_lines | select('match', '^sonarr=') | first | regex_replace('^sonarr=', '') }}"
        radarr_key: "{{ keys.stdout_lines | select('match', '^radarr=') | first | regex_replace('^radarr=', '') }}"
      no_log: true

    # ---- 1. Icons Unearthed: Season 9 files back to their Season 1 paths ----
    - name: Move the six files back (only when the source exists and the target does not)
      ansible.builtin.shell: |
        src="{{ icons_dir }}/Season 9/{{ icons_prefix }}{{ item.from }}{{ icons_suffix }}"
        dst="{{ icons_dir }}/Season 1/{{ icons_prefix }}{{ item.to }}{{ icons_suffix }}"
        if [ -f "$src" ] && [ ! -e "$dst" ]; then
          sudo -n -u {{ nas_user }} mkdir -p "{{ icons_dir }}/Season 1"
          sudo -n -u {{ nas_user }} mv -n "$src" "$dst" && echo "moved: {{ item.from }} -> {{ item.to }}"
        else
          echo "skip {{ item.to }}: src exists=$([ -f "$src" ] && echo y || echo n), dst exists=$([ -e "$dst" ] && echo y || echo n)"
        fi
      args:
        executable: /bin/bash
      loop: "{{ icons_renames }}"
      loop_control:
        label: "{{ item.to }}"
      register: moved
      changed_when: "'moved:' in moved.stdout"

    - name: Empty Season 9 folder gone
      ansible.builtin.shell: |
        d="{{ icons_dir }}/Season 9"
        [ -d "$d" ] && [ -z "$(ls -A "$d")" ] && sudo -n -u {{ nas_user }} rmdir "$d" && echo "removed $d"
        true
      args:
        executable: /bin/bash
      register: s9
      changed_when: "'removed' in s9.stdout"

    - name: Season 1 on disk
      ansible.builtin.command: ls -l "{{ icons_dir }}/Season 1"
      changed_when: false
      register: s1ls

    - name: Six files in Season 1
      ansible.builtin.assert:
        that: s1ls.stdout_lines | select('search', 'S01E0[1-6]') | list | length == 6
        fail_msg: "{{ s1ls.stdout }}"

    - name: Show what moved
      ansible.builtin.debug:
        msg: "{{ moved.results | map(attribute='stdout') | list }}"

    - name: Sonarr rescans the series (drops the stale S09 records, re-finds S01)
      ansible.builtin.uri:
        url: http://127.0.0.1:8989/api/v3/command
        method: POST
        headers: { X-Api-Key: "{{ sonarr_key }}" }
        body_format: json
        body: '{"name":"RescanSeries","seriesId":{{ sonarr_series_id }}}'    # numeric; a quoted id is a 500
        status_code: [200, 201]
      changed_when: true

    - name: Give the rescan a moment
      ansible.builtin.pause:
        seconds: 20

    - name: Files per season after the rescan
      ansible.builtin.uri:
        url: "http://127.0.0.1:8989/api/v3/episodefile?seriesId={{ sonarr_series_id }}"
        headers: { X-Api-Key: "{{ sonarr_key }}" }
        return_content: true
      register: after

    - name: Season 1 has its six files back and Season 9 none
      ansible.builtin.assert:
        that:
          - after.json | selectattr('seasonNumber', 'eq', 1) | list | length >= 6
          - after.json | selectattr('seasonNumber', 'eq', 9) | list | length == 0
        fail_msg: "season counts: {{ after.json | map(attribute='seasonNumber') | list }}"

    - name: Search Season 9 again (the deleted download)
      ansible.builtin.uri:
        url: http://127.0.0.1:8989/api/v3/command
        method: POST
        headers: { X-Api-Key: "{{ sonarr_key }}" }
        body_format: json
        body: '{"name":"SeasonSearch","seriesId":{{ sonarr_series_id }},"seasonNumber":9}'
        status_code: [200, 201]
      changed_when: true

    # ---- 2. Approved deletes ----
    - name: MobLand S02E05 out of Sonarr's queue, files removed through SABnzbd
      ansible.builtin.uri:
        url: "http://127.0.0.1:8989/api/v3/queue/{{ mobland_queue_id }}?removeFromClient=true&blocklist=false"
        method: DELETE
        headers: { X-Api-Key: "{{ sonarr_key }}" }
        status_code: [200, 404] # 404 = already gone
      register: mob
      changed_when: mob.status == 200

    - name: Leftover MobLand, test file and the old incomplete folder
      ansible.builtin.shell: |
        set -u
        sleep 10
        for p in {{ complete_dir }}/MobLand.S02E05* {{ complete_dir }}/test_download_100MB; do
          [ -e "$p" ] && sudo -n -u {{ nas_user }} rm -rf "$p" && echo "removed $p"
        done
        if grep -q '^download_dir *= */incomplete' {{ appdata_root }}/sabnzbd/sabnzbd.ini && [ -d {{ old_incomplete }} ]; then
          du -sh {{ old_incomplete }}; sudo -n -u {{ nas_user }} rm -rf {{ old_incomplete }} && echo "removed {{ old_incomplete }}"
        fi
        true
      args:
        executable: /bin/bash
      register: rmres
      changed_when: "'removed' in rmres.stdout"

    - name: Deleted
      ansible.builtin.debug:
        var: rmres.stdout_lines

    # ---- 3. SABnzbd duplicate detection off (the ini is only safe to edit with the container stopped) ----
    - name: Current duplicate settings
      ansible.builtin.shell: grep -E '^(no_dupes|no_smart_dupes)\s*=' {{ appdata_root }}/sabnzbd/sabnzbd.ini
      register: dupes
      changed_when: false

    - name: Stop SABnzbd
      ansible.builtin.command:
        cmd: docker compose stop -t 60 sabnzbd
        chdir: "{{ stacks_root }}/media"
      when: dupes.stdout is not search('no_dupes = 0') or dupes.stdout is not search('no_smart_dupes = 0')
      changed_when: true

    - name: no_dupes and no_smart_dupes off
      ansible.builtin.lineinfile:
        path: "{{ appdata_root }}/sabnzbd/sabnzbd.ini"
        regexp: '^{{ item }}\s*='
        line: "{{ item }} = 0"
      loop: [no_dupes, no_smart_dupes]

    - name: Start SABnzbd
      ansible.builtin.command:
        cmd: docker compose up -d --no-deps --wait --wait-timeout 180 sabnzbd
        chdir: "{{ stacks_root }}/media"
      changed_when: true

    - name: Duplicate settings after
      ansible.builtin.shell: grep -E '^(no_dupes|no_smart_dupes)\s*=' {{ appdata_root }}/sabnzbd/sabnzbd.ini
      register: dupes_after
      changed_when: false
      failed_when: dupes_after.stdout is not search('no_dupes = 0') or dupes_after.stdout is not search('no_smart_dupes = 0')

    # ---- 4. Radarr queue items that are not import problems (opt-in) ----
    - name: Radarr queue
      ansible.builtin.uri:
        url: http://127.0.0.1:7878/api/v3/queue?pageSize=200
        headers: { X-Api-Key: "{{ radarr_key }}" }
        return_content: true
      register: rq
      when: radarr_cleanup | bool

    - name: Remove and blocklist the three, files deleted through SABnzbd
      ansible.builtin.uri:
        url: "http://127.0.0.1:7878/api/v3/queue/{{ item.id }}?removeFromClient=true&blocklist=true"
        method: DELETE
        headers: { X-Api-Key: "{{ radarr_key }}" }
        status_code: [200, 404]
      loop: "{{ rq.json.records | selectattr('title', 'search', radarr_titles | join('|')) | list }}"
      loop_control:
        label: "{{ item.title }}"
      when: radarr_cleanup | bool
      changed_when: true

    - name: Leftover Radarr folders in complete/
      ansible.builtin.shell: |
        sleep 10
        for t in {{ radarr_titles | join(' ') }}; do
          for p in {{ complete_dir }}/"$t"*; do [ -e "$p" ] && sudo -n -u {{ nas_user }} rm -rf "$p" && echo "removed $p"; done
        done
        true
      args:
        executable: /bin/bash
      register: rrm
      changed_when: "'removed' in rrm.stdout"
      when: radarr_cleanup | bool

    - name: Radarr cleanup result
      ansible.builtin.debug:
        var: rrm.stdout_lines
      when: radarr_cleanup | bool
