# Move SABnzbd's temp (incomplete) folder off the media VM's system disk onto a dedicated
# virtual disk (2026-10-22). Run from the Mac:
#
#   ansible-playbook playbooks/sabnzbd-temp-disk.yml
#
# 1. Host: hot-add scsi1 to VM 202 on the xfstest SSD (skipped when scsi1 exists).
# 2. media VM: format/mount it (role scratch), report it to n8n (role ops), pause SABnzbd,
#    stop the container, move the in-progress jobs over, point SABnzbd at /incomplete with the
#    new free-space floors and Direct Unpack on, recreate the container, resume.
# Undo: set download_dir back to /config/incomplete in /opt/appdata/sabnzbd/sabnzbd.ini with the
# container stopped, move the job folders back, `docker compose up -d sabnzbd`; on the host
# `qm set 202 --delete scsi1` then `qm disk unlink 202 --idlist unused0`.
- name: Scratch disk on the Proxmox host
  hosts: ricksgarage
  gather_facts: false
  vars:
    vmid: 202
    scratch_storage: xfstest # second SSD on RicksGarage, separate from the local-lvm pool the VMs boot from
    scratch_gb: 200
  tasks:
    - name: Current VM config
      ansible.builtin.command: qm config {{ vmid }}
      register: qm_config
      changed_when: false

    # backup=0: nothing worth backing up; discard/ssd so deleted downloads return space to the host.
    - name: Add scsi1 (live; the guest sees a new disk at once)
      ansible.builtin.command: >-
        qm set {{ vmid }} --scsi1
        {{ scratch_storage }}:{{ scratch_gb }},format=qcow2,discard=on,ssd=1,iothread=1,backup=0
      when: qm_config.stdout_lines | select('match', '^scsi1:') | list | length == 0

- name: SABnzbd onto the scratch disk
  hosts: media
  become: true
  vars:
    sab_ini: "{{ appdata_root }}/sabnzbd/sabnzbd.ini"
    sab_old_incomplete: "{{ appdata_root }}/sabnzbd/incomplete"
    sab_settings:
      download_dir: /incomplete        # the scratch disk, bound into the container by compose
      download_free: 20G               # pause with room to finish unpacking the current job
      complete_free: 500G              # stop before the NAS pool (about 75% full) gets dangerous
      direct_unpack: "1"               # unpack while downloading; temp is freed sooner
  roles:
    - scratch
    - ops
  tasks:
    - name: SABnzbd API key
      ansible.builtin.shell: sed -n 's/^api_key *= *//p' {{ sab_ini }} | head -1
      register: sab_key
      changed_when: false
      no_log: true

    - name: Pause the queue
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/api?mode=pause&output=json&apikey={{ sab_key.stdout }}"
      failed_when: false
      no_log: true

    - name: Stop the container (SABnzbd writes its ini on shutdown; edit it only after this)
      ansible.builtin.command:
        cmd: docker compose stop -t 60 sabnzbd
        chdir: "{{ stacks_root }}/media"
      changed_when: true

    - name: Move the in-progress jobs to the scratch disk
      ansible.builtin.shell: |
        set -e
        shopt -s nullglob dotglob
        for f in {{ sab_old_incomplete }}/*; do mv -n "$f" {{ scratch_disk.mount }}/; done
        rmdir {{ sab_old_incomplete }} 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: true

    - name: SABnzbd settings ([misc] keys are unique in the ini)
      ansible.builtin.lineinfile:
        path: "{{ sab_ini }}"
        regexp: '^{{ item.key }}\s*='
        line: "{{ item.key }} = {{ item.value }}"
      loop: "{{ sab_settings | dict2items }}"

    - name: Compose file with the /incomplete bind
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../stacks/media/"
        dest: "{{ stacks_root }}/media/"
        delete: false
        owner: false
        group: false
        rsync_opts: ["--exclude=*.sops.env"]

    - name: Recreate SABnzbd only
      ansible.builtin.command:
        cmd: docker compose up -d --no-deps --wait --wait-timeout 180 sabnzbd
        chdir: "{{ stacks_root }}/media"
      changed_when: true

    - name: Resume the queue
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/api?mode=resume&output=json&apikey={{ sab_key.stdout }}"
      register: sab_resume
      retries: 6
      delay: 10
      until: sab_resume.status == 200
      no_log: true

    - name: Where SABnzbd thinks temp is now
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/api?mode=get_config&section=misc&keyword=download_dir&output=json&apikey={{ sab_key.stdout }}"
        return_content: true
      register: sab_check
      no_log: true

    - name: Result
      ansible.builtin.debug:
        msg: "download_dir={{ sab_check.json.config.misc.download_dir }}; {{ scratch_disk.mount }} mounted from {{ scratch_disk.device }}"
