# "Lab is dark" alert. Everything that can email (Uptime Kuma, n8n) runs inside the lab, so a
# power cut silences it. Each Proxmox host pings a healthchecks.io check every 5 minutes;
# when the pings stop, healthchecks.io emails Goobs. Set heartbeat_url per host in hosts.yml
# once the checks exist (one per host, so a single dead host is visible too).
- name: Heartbeat pings from both Proxmox hosts
  hosts: proxmox
  tasks:
    - name: curl is present
      ansible.builtin.apt:
        name: [curl]
      when: heartbeat_url is defined

    - name: Heartbeat cron
      ansible.builtin.cron:
        name: homelab heartbeat
        minute: "*/5"
        job: "curl -fsS -m 10 --retry 3 -o /dev/null {{ heartbeat_url }} >/dev/null 2>&1"
      when: heartbeat_url is defined

    - name: No heartbeat URL for this host yet
      ansible.builtin.debug:
        msg: "heartbeat_url not set for {{ inventory_hostname }}; nothing installed."
      when: heartbeat_url is not defined
