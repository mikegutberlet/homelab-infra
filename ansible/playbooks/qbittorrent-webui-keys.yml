# One-time repair after the qBittorrent 5.3.0 -> 5.2.4 downgrade (2026-11-05, docs/books.md).
# 5.3 had moved the WebUI settings into a [WebUI] section that 5.2 does not read, so 5.2.4 started
# with a temporary password and every arr app got locked out. This stops qBittorrent, keeps a copy
# of the config, copies the WebUI keys back under [Preferences], starts qBittorrent and checks that
# localhost answers without a login again (which also clears the IP bans). Run from the Mac:
#
#   ansible-playbook playbooks/qbittorrent-webui-keys.yml --check   # report only, no stop
#   ansible-playbook playbooks/qbittorrent-webui-keys.yml
#
# Undo: copy qBittorrent.conf.pre-webui-keys back over qBittorrent.conf and restart qbittorrent.
- name: qBittorrent WebUI keys back where 5.2 reads them
  hosts: media
  become: true
  vars:
    conf: "{{ appdata_root }}/qbittorrent/qBittorrent/qBittorrent.conf"
  tasks:
    - name: What would change
      ansible.builtin.script:
        cmd: files/qbittorrent_webui_keys.py --dry-run
        executable: /usr/bin/python3
      register: plan
      check_mode: false
      changed_when: false

    - name: Plan
      ansible.builtin.debug:
        msg: "{{ plan.stdout_lines }}"

    - name: Apply (qBittorrent stopped while the file changes)
      when: not ansible_check_mode and 'would add 0 ' not in plan.stdout
      block:
        - name: Stop qBittorrent
          ansible.builtin.command:
            cmd: docker compose stop -t 30 qbittorrent
            chdir: "{{ stacks_root }}/media"
          changed_when: true

        - name: Keep the config as it was
          ansible.builtin.copy:
            src: "{{ conf }}"
            dest: "{{ conf }}.pre-webui-keys"
            remote_src: true
            mode: preserve

        - name: Copy the keys
          ansible.builtin.script:
            cmd: files/qbittorrent_webui_keys.py
            executable: /usr/bin/python3
          register: applied
          changed_when: "'adding 0 ' not in applied.stdout"

        - name: Start qBittorrent
          ansible.builtin.command:
            cmd: docker compose start qbittorrent
            chdir: "{{ stacks_root }}/media"
          changed_when: true

    - name: Localhost answers without a login (what the arr apps and the helpers rely on)
      when: not ansible_check_mode
      ansible.builtin.command:
        cmd: docker exec media-qbittorrent-1 wget -qO- http://127.0.0.1:8085/api/v2/app/version
      register: version
      retries: 12
      delay: 5
      until: version.rc == 0
      changed_when: false

    - name: Result
      when: not ansible_check_mode
      ansible.builtin.debug:
        msg: "qBittorrent {{ version.stdout }} answers on localhost without a login; the arr apps' bans clear with the restart."
