[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent

[ssh_connection]
# Trust a host's key the first time, refuse it if it ever changes (after re-creating a VM:
# ssh-keygen -R <ip>). Ansible's own default options are kept.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
