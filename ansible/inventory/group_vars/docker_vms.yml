# Every app runs as the "storage" user, which already owns most of the library on
# TrueNAS (uid 3000). The old setup split SABnzbd (uid 1000) from the Arr apps
# (uid 3000), which broke imports from August until 2026-10-21.
app_user: storage
app_uid: 3000
app_gid: 3000 # storage group on TrueNAS is gid 3000 (checked 2026-10-21)

stacks_root: /opt/stacks
appdata_root: /opt/appdata # local disk; never on NFS (SQLite/Postgres corrupt there)

nfs_shares:
  nas:
    src: "192.168.1.209:/mnt/DeepData/NAS"
    # Same path as the old Servarr VM, so migrated Sonarr/Radarr root folders keep working.
    path: /mnt/nfs
    # nconnect=4 (2026-10-22): no extra throughput on 1 GbE, but small metadata calls stop
    # queueing behind 1 MB media reads on one TCP stream. Applies at the next remount or boot.
    opts: "nfsvers=4.2,nconnect=4,hard,noatime,_netdev,x-systemd.automount,x-systemd.mount-timeout=30"
nfs_readahead_kb: 4096 # kernel default 128; sequential media reads over 1 GbE (role nfs)

swap_mb: 2048 # role base; media overrides (hosts.yml)

timezone: America/Los_Angeles # same as the Proxmox hosts and TrueNAS

# lanfw: interface the LAN arrives on (Debian cloud image).
lanfw_iface: eth0

# Host-networked metrics ports only Prometheus may reach (lanfw chain LANFW-IN); edge adds Tailscale's.
metrics_scraper: 192.168.1.53
host_metrics_ports: ["9100/tcp"]

# Junior sysadmin (role ops): where the reporter posts, and what the ops door may never
# restart or stop (n8n would cut its own SSH session; databases and autoheal stay put;
# the tailscale container is the only way in from outside).
ops_report_url: http://192.168.1.53:5678/webhook/homelab/report
ops_never: [n8n, postgres, redis, autoheal, tailscale, immich-db, immich-redis, romm-db, authentik-db, authentik-redis, scrutiny-influx]
# Public half of the key n8n uses for the ops door (private key only in n8n's credential store).
# Generate on the Mac: ssh-keygen -t ed25519 -N '' -C n8n-ops -f ~/.config/homelab/ops_ed25519
ops_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFvwWu+OpdSLNembAGzQTtZI24dBIUjrhZ79ImzoXJky n8n-ops"

# The sysadmin's investigator (stacks/apps/sysadmin-investigator) reads each VM through the inspect
# user (role ops). Its key pair is made on the Mac by docs/sysadmin_deploy.py; the public half is
# read from there at play time, so nothing to commit. Only the apps VM may use it.
inspect_pubkey: "{{ lookup('file', lookup('env', 'HOME') ~ '/.config/homelab/inspect_ed25519.pub', errors='ignore') | default('', true) }}"
inspect_from: 192.168.1.53
