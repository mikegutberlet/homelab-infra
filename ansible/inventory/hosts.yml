all:
  children:
    proxmox:
      hosts:
        ricksgarage:
          ansible_host: 192.168.1.137
        ricksship:
          ansible_host: 192.168.1.37
      vars:
        ansible_user: root

    docker_vms:
      hosts:
        edge:
          ansible_host: 192.168.1.50
          stacks: [edge]
          # wg-easy stays off until its admin account is set up (its first-run page is open on the LAN).
          # TS_AUTHKEY must be a *reusable* key: tsdproxy logs in ~31 devices with it.
          stack_services:
            edge: [socket-proxy, traefik, authentik-db, authentik-redis, authentik-server, authentik-worker, tsdproxy, tailscale, autoheal]
        media:
          ansible_host: 192.168.1.51
          stacks: [media]
          nfs_mounts: [nas]
          # (Media/Podcasts for audiobookshelf was created on the NAS 2026-10-21, 3000:3000.)
          # jellyseerr runs on the migrated Overseerr data; its settings.json needed main.mediaServerType=1
          # and an empty "jellyfin" section, or migration 0002 crashes (2026-10-21).
          # recyclarr manages "HD and Ultra" (Sonarr) and "Anything Not terrible" (Radarr) by name.
          appdata_owned_dirs: [recyclarr]
          stack_services:
            media: [sonarr, radarr, prowlarr, bazarr, sabnzbd, gluetun, qbittorrent, recyclarr, jellyseerr, metube, storyteller, romm-db, romm, audiobookshelf, autoheal]
        gpu:
          ansible_host: 192.168.1.52
          stacks: [gpu]
          nfs_mounts: [nas]
          igpu: true
        apps:
          ansible_host: 192.168.1.53
          stacks: [apps]
          nfs_mounts: [nas]
        ai:
          ansible_host: 192.168.1.54
          stacks: [ai]
          # open-webui needs an LLM key, and anythingllm/worker need Postgres on the apps VM (stopped).
          stack_services:
            ai: [piper, autoheal]
      vars:
        ansible_user: goobs
        ansible_become: true
