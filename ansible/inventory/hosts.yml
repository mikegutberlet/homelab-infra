all:
  children:
    proxmox:
      hosts:
        ricksgarage:
          ansible_host: 192.168.1.137
        ricksship:
          ansible_host: 192.168.1.37
      vars:
        ansible_user: root

    docker_vms:
      hosts:
        edge:
          ansible_host: 192.168.1.50
          stacks: [edge]
          # wg-easy stays off until its admin account is set up (its first-run page is open on the LAN).
          # tsdproxy stays off until TS_AUTHKEY is a *reusable* key: it logs in ~31 devices with it,
          # and the first key was single-use (consumed by the subnet router).
          stack_services:
            edge: [socket-proxy, traefik, authentik-db, authentik-redis, authentik-server, authentik-worker, tailscale, autoheal]
        media:
          ansible_host: 192.168.1.51
          stacks: [media]
          nfs_mounts: [nas]
          # Off until their credentials exist: gluetun/qbittorrent (PIA), recyclarr (Arr API keys).
          # audiobookshelf mounts Media/Podcasts, which doesn't exist yet and would be created on the NAS.
          stack_services:
            media: [sonarr, radarr, prowlarr, bazarr, sabnzbd, jellyseerr, metube, storyteller, romm-db, romm, autoheal]
        gpu:
          ansible_host: 192.168.1.52
          stacks: [gpu]
          nfs_mounts: [nas]
          igpu: true
        apps:
          ansible_host: 192.168.1.53
          stacks: [apps]
          nfs_mounts: [nas]
        ai:
          ansible_host: 192.168.1.54
          stacks: [ai]
          # open-webui needs an LLM key, and anythingllm/worker need Postgres on the apps VM (stopped).
          stack_services:
            ai: [piper, autoheal]
      vars:
        ansible_user: goobs
        ansible_become: true
