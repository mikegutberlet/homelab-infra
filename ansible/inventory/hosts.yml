all:
  children:
    proxmox:
      hosts:
        ricksgarage:
          ansible_host: 192.168.1.137
          # heartbeat_url: https://hc-ping.com/<uuid>   # playbooks/proxmox-heartbeat.yml
        ricksship:
          ansible_host: 192.168.1.37
          # heartbeat_url: https://hc-ping.com/<uuid>
        ricksportalgun:
          ansible_host: 192.168.1.38 # third NUC, joined 2026-10-26; transcode VM, then apps and media (2026-10-27 plan)
          # heartbeat_url: https://hc-ping.com/<uuid>
      vars:
        ansible_user: root

    docker_vms:
      hosts:
        edge:
          ansible_host: 192.168.1.50
          lan_open_ports: ["51820/udp"] # wg-easy, once enabled
          host_metrics_ports: ["9100/tcp", "9002/tcp"] # node-exporter, Tailscale's metrics
          stacks: [edge]
          # wg-easy stays off until its admin account is set up (its first-run page is open on the LAN).
          ops_cert_skip: [wireguard] # its ts.net name has no service behind it while wg-easy is off
          # TS_AUTHKEY must be a *reusable* key: tsdproxy logs in ~31 devices with it.
          stack_services:
            edge: [traefik, authentik-db, authentik-redis, authentik-server, authentik-worker, tsdproxy, tailscale, socket-proxy, autoheal, diun]
        media:
          ansible_host: 192.168.1.51
          lan_open_ports: ["5055/tcp"] # Jellyseerr stays on the LAN
          swap_mb: 4096 # SABnzbd unpacks and Bazarr subtitle syncs spike together
          # SABnzbd's incomplete folder: a 200 GB disk of its own (scsi1, 2026-10-22; on
          # PortalGunSpare since 2026-10-27, tofu/vms.tf), so download churn never fills the 64 GB system disk.
          scratch_disk: { device: /dev/sdb, label: usenet-tmp, mount: /srv/usenet-incomplete }
          ops_extra_disks: [/srv/usenet-incomplete] # the agent reports its fill level too
          stacks: [media]
          nfs_mounts: [nas]
          # (Media/Podcasts for audiobookshelf was created on the NAS 2026-10-21, 3000:3000.)
          # jellyseerr runs on the migrated Overseerr data; its settings.json needed main.mediaServerType=1
          # and an empty "jellyfin" section, or migration 0002 crashes (2026-10-21).
          # recyclarr manages "HD and Ultra" (Sonarr) and "Anything Not terrible" (Radarr) by name.
          # listenarr/chaptarr: their images create /config as root if the folder does not exist first.
          appdata_owned_dirs: [recyclarr, listenarr, chaptarr]
          stack_services:
            media: [sonarr, radarr, prowlarr, bazarr, sabnzbd, gluetun, qbittorrent, flaresolverr, recyclarr, profile-sorter, stalled-cleaner, backlog-search, jellyseerr, metube, storyteller, listenarr, chaptarr, romm-db, romm, audiobookshelf, socket-proxy, autoheal, diun]
          # Services the sysadmin updates itself when Diun finds a new image (ops verb update, 03:00-05:00 PT);
          # the rest it only lists as "update available (by hand)". Same key on gpu.
          auto_update:
            media: [sonarr, radarr, prowlarr, bazarr, sabnzbd, qbittorrent, flaresolverr, jellyseerr]
        gpu:
          ansible_host: 192.168.1.52
          lan_open_ports: ["8096/tcp"] # Emby (Plex is host-networked, unaffected)
          stacks: [gpu]
          nfs_mounts: [nas]
          igpu: true
          appdata_owned_dirs: [kometa, kometa/logs] # Kometa runs as the storage user
          # Tdarr re-encodes Media/Movies (read-write, 2026-10-21); Unmanic stays read-only, no libraries.
          stack_services:
            gpu: [plex, emby, ersatztv, immich-server, immich-machine-learning, immich-redis, immich-db, tdarr, unmanic, kometa, home-rows, socket-proxy, autoheal, diun]
          auto_update:
            gpu: [plex, emby] # Tdarr, Immich and the pinned ErsatzTV stay manual
          # The transcode VM's Tdarr node connects to the server here (outside the .50-.54 range).
          lanfw_extra_allow:
            - {src: 192.168.1.55, port: 8266}
        apps:
          ansible_host: 192.168.1.53
          # heartbeat_url: https://hc-ping.com/<uuid>   # playbooks/proxmox-heartbeat.yml: pings only while n8n answers
          stacks: [apps]
          nfs_mounts: [nas]
          appdata_dir_owners: {n8n: 1000}
          # Prometheus and Grafana run as the storage user, and so does the sysadmin's investigator (state in data/).
          appdata_owned_dirs: [prometheus, grafana, sysadmin-investigator, sysadmin-investigator/data]
          edge_only_ports: ["3005/tcp"] # Grafana trusts X-authentik-username: only Traefik may reach it
          # Scrutiny collectors on the Proxmox hosts report here; TrueNAS pushes Graphite metrics.
          lanfw_extra_allow:
            - {src: 192.168.1.137, port: 8087}
            - {src: 192.168.1.37, port: 8087}
            - {src: 192.168.1.38, port: 8087}
            - {src: 192.168.1.209, port: 2003}
        ai:
          ansible_host: 192.168.1.54
          edge_only_ports: ["3010/tcp"] # Open WebUI trusts X-authentik-email: only Traefik may reach it
          stacks: [ai]
          # The worker (LangChain/CrewAI) isn't started yet.
          appdata_dir_owners: {anythingllm: 1000} # the image runs as uid 1000
          stack_services:
            ai: [piper, open-webui, anythingllm, socket-proxy, autoheal, diun]
        transcode:
          ansible_host: 192.168.1.55 # RicksPortalGun, second Tdarr node on its iGPU (2026-10-27)
          stacks: [transcode]
          nfs_mounts: [nas]
          igpu: true
          appdata_owned_dirs: [tdarr-node, tdarr-node/configs, tdarr-node/logs, transcode, transcode/tdarr]
          stack_services:
            transcode: [tdarr-node, socket-proxy, autoheal, diun]
      vars:
        ansible_user: goobs
        ansible_become: true
