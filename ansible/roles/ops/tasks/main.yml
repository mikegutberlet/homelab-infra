# Junior sysadmin (n8n "Homelab sysadmin" workflow, stacks/apps/n8n): a reporter that POSTs this
# VM's facts to n8n every 15 minutes, and the "ops door", an SSH user whose key can only run
# /usr/local/sbin/homelab-ops (forced command + one sudo rule). Nothing here reboots, deletes
# or changes app settings; see the verbs in files/homelab-ops.sh.
- name: Tools the agent uses
  ansible.builtin.apt:
    name: [jq, curl, openssl, sqlite3] # sqlite3: login fingerprints from the arr databases

# Expected services: every service in each stack's compose file (read on the Mac), limited to
# stack_services where hosts.yml sets it. The allow-list for restarts leaves out ops_never.
- name: Expected and restartable services
  ansible.builtin.set_fact:
    ops_expected: >-
      {%- set out = [] -%}
      {%- for s in stacks | default([]) -%}
        {%- set svcs = (lookup('file', playbook_dir ~ '/../../stacks/' ~ s ~ '/compose.yaml') | from_yaml).services.keys() | list -%}
        {%- if (stack_services | default({}))[s] is defined -%}
          {%- set svcs = svcs | intersect((stack_services | default({}))[s]) -%}
        {%- endif -%}
        {%- for v in svcs -%}{%- set _ = out.append(s ~ '/' ~ v) -%}{%- endfor -%}
      {%- endfor -%}
      {{ out | sort }}

- name: Allow-list without the services the door must never touch
  ansible.builtin.set_fact:
    ops_allow: "{{ ops_expected | reject('search', '/(' ~ (ops_never | join('|')) ~ ')$') | list }}"

# What remount-nas recreates: allow-listed services that bind /mnt/nfs, plus those that depend on
# one of them (nextcloud-web's nginx resolves nextcloud only at start). Never the whole stack.
- name: Services that bind the NAS mount
  ansible.builtin.set_fact:
    ops_nfs_services: >-
      {%- set out = [] -%}
      {%- for s in stacks | default([]) -%}
        {%- set svcs = (lookup('file', playbook_dir ~ '/../../stacks/' ~ s ~ '/compose.yaml') | from_yaml).services -%}
        {%- set nfs = [] -%}
        {%- for v, cfg in svcs.items() -%}
          {%- for vol in cfg.volumes | default([]) -%}
            {%- set src = vol if vol is string else (vol.source | default('')) -%}
            {%- if src.startswith('/mnt/nfs') and v not in nfs -%}{%- set _ = nfs.append(v) -%}{%- endif -%}
          {%- endfor -%}
        {%- endfor -%}
        {%- for v, cfg in svcs.items() -%}
          {%- set deps = cfg.depends_on | default([]) -%}
          {%- set deps = deps.keys() | list if deps is mapping else deps -%}
          {%- if v not in nfs and deps | select('in', nfs) | list | length > 0 -%}{%- set _ = nfs.append(v) -%}{%- endif -%}
        {%- endfor -%}
        {%- for v in nfs -%}{%- if (s ~ '/' ~ v) in ops_allow -%}{%- set _ = out.append(s ~ '/' ~ v) -%}{%- endif -%}{%- endfor -%}
      {%- endfor -%}
      {{ out | sort }}

- name: Agent configuration
  ansible.builtin.copy:
    dest: /etc/homelab-agent.conf
    mode: "0644"
    content: |
      # Written by Ansible (role ops). Read by homelab-agent and homelab-ops.
      REPORT_URL={{ ops_report_url }}
      STACKS="{{ stacks | default([]) | join(' ') }}"
      EXPECTED="{{ ops_expected | join(' ') }}"
      NAS_IP=192.168.1.209
      # Only VMs with nfs_mounts in hosts.yml have /mnt/nfs; the rest skip that check.
      NFS_EXPECTED={{ (nfs_mounts | default([]) | length > 0) | lower }}
      NFS_SERVICES="{{ ops_nfs_services | join(' ') }}"
      # hosts.yml stack_services as stack/service: the deploy verb starts only these, as the stacks role does.
      STACK_SERVICES="{% for s, v in (stack_services | default({})).items() %}{% for x in v %}{{ s }}/{{ x }} {% endfor %}{% endfor %}"
      # ts.net names the edge agent does not probe: their service is off on purpose (hosts.yml).
      CERT_SKIP="{{ ops_cert_skip | default([]) | join(' ') }}"
      EXTRA_DISKS="{{ ops_extra_disks | default([]) | join(' ') }}"

- name: Scripts
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/usr/local/sbin/{{ item.dest }}"
    mode: "0750"
    owner: root
    group: root
  loop:
    - { src: homelab-agent.sh, dest: homelab-agent }
    - { src: homelab-ops.sh, dest: homelab-ops }
    # Read-only shell for the investigator (below) and the never-list of the run-approved fix.
    - { src: homelab-inspect.py, dest: homelab-inspect }
    - { src: homelab-script-check.py, dest: homelab-script-check }

- name: Agent service
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-agent.service
    mode: "0644"
    content: |
      [Unit]
      Description=Homelab sysadmin reporter (POSTs this VM's state to n8n)
      After=docker.service network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/homelab-agent
      # Every NAS access in the agent is time-boxed; a hung NAS still costs up to about 3 minutes.
      TimeoutStartSec=360
      Nice=10

# Fixed minutes per VM (edge :01, media :04, gpu :07, transcode :09, apps :10, ai :12, then every 15 minutes),
# so two reports never land at once: n8n saves the whole static data at the end of each run, and
# of two overlapping runs the later one wins. The infra check runs at :14 and the digest at 08:00.
- name: Agent timer (every 15 minutes, a fixed minute per VM)
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-agent.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Homelab sysadmin reporter

      [Timer]
      OnCalendar=*:{{ '%02d' | format(ops_report_minute | default({'edge': 1, 'media': 4, 'gpu': 7, 'transcode': 9, 'apps': 10, 'ai': 12}.get(inventory_hostname, 0)) | int) }}/15
      AccuracySec=1s
      RandomizedDelaySec=15
      Persistent=false

      [Install]
      WantedBy=timers.target
  register: ops_timer

- name: Agent timer enabled (restarted when its schedule changed)
  ansible.builtin.systemd:
    name: homelab-agent.timer
    enabled: true
    state: "{{ 'restarted' if ops_timer.changed else 'started' }}"
    daemon_reload: true

# The ops door: only when the public key is set (ansible/inventory/group_vars/docker_vms.yml).
- name: ops user (password locked; every login runs the forced command)
  ansible.builtin.user:
    name: ops
    shell: /bin/bash
    create_home: true
    password_lock: true
  when: ops_pubkey is defined

- name: Forced-command wrapper
  ansible.builtin.copy:
    src: homelab-ops-door.sh
    dest: /usr/local/sbin/homelab-ops-door
    mode: "0755"
  when: ops_pubkey is defined

# Hermes (stacks/apps/hermes) may use the same door with its inspect key (hermes_inspect_pubkey), but
# only after Goobs says go in the chat (homelab skill); an empty key is simply left out of the list.
- name: ops key pinned to the door and to the apps VM (no pty, no forwarding)
  ansible.posix.authorized_key:
    user: ops
    # Double-quoted for the same reason as the inspect keys below: \n must reach Jinja as a newline.
    key: "{{ [ops_pubkey, hermes_inspect_pubkey | default('')] | select | join('\n') }}"
    key_options: 'from="{{ ops_from }}",command="/usr/local/sbin/homelab-ops-door",no-pty,no-port-forwarding,no-agent-forwarding,no-X11-forwarding,no-user-rc'
    exclusive: true
  when: ops_pubkey is defined

- name: ops may run only homelab-ops as root
  ansible.builtin.copy:
    dest: /etc/sudoers.d/homelab-ops
    mode: "0440"
    content: |
      ops ALL=(root) NOPASSWD: /usr/local/sbin/homelab-ops
      ops ALL=(root) NOPASSWD: /usr/local/sbin/homelab-ops *
    validate: visudo -cf %s
  when: ops_pubkey is defined

- name: Services homelab-ops may restart or stop
  ansible.builtin.copy:
    dest: /etc/homelab-ops.allow
    mode: "0644"
    content: |
      # Written by Ansible (role ops): stack/service pairs the ops door accepts. n8n itself,
      # databases and Tailscale are left out on purpose (ops_never); homelab-agent reports this list.
      {% for s in ops_allow %}
      {{ s }}
      {% endfor %}

# Services the sysadmin may update (ops verb "update"): hosts.yml auto_update, {stack: [service, ...]}.
# Internet-facing media apps only; apps with a database migration risk (Authentik, Nextcloud,
# Immich, Paperless) stay manual and only show up as "update available".
- name: Auto-update list
  ansible.builtin.copy:
    dest: /etc/homelab-autoupdate.conf
    mode: "0644"
    content: |
      # Written by Ansible (role ops, hosts.yml auto_update): "stack service ..." per line.
      # Read by homelab-ops (verb update) and homelab-agent (reported to n8n).
      {% for stack, svcs in (auto_update | default({})).items() %}
      {{ stack }} {{ svcs | join(' ') }}
      {% endfor %}

# The investigator (stacks/apps/sysadmin-investigator, on the apps VM) looks around with this key:
# only from the apps VM's address, pinned to homelab-inspect-door, which hands the requested line to
# homelab-inspect (read-only programs, flags and paths; secrets masked before they leave the VM).
# inspect_pubkey comes from the Mac (~/.config/homelab/inspect_ed25519.pub, made by
# docs/sysadmin_deploy.py); without it these steps are skipped.
- name: inspect user (password locked; every login runs the read-only door)
  ansible.builtin.user:
    name: inspect
    shell: /bin/bash
    create_home: true
    password_lock: true
  when: inspect_pubkey | default('') | length > 0

- name: Read-only door for the inspect key
  ansible.builtin.copy:
    src: homelab-inspect-door.sh
    dest: /usr/local/sbin/homelab-inspect-door
    mode: "0755"
  when: inspect_pubkey | default('') | length > 0

# Hermes (stacks/apps/hermes) reads through the same door with its own key (hermes_inspect_pubkey,
# made by docs/hermes_setup.sh); an empty key is simply left out of the list.
- name: inspect keys pinned to the door and to the apps VM
  ansible.posix.authorized_key:
    user: inspect
    # Double-quoted on purpose: YAML turns \n into a real newline before Jinja sees it. In single
    # quotes Ansible wrote a literal "\n", so the second key ended up inside the first key's comment.
    key: "{{ [inspect_pubkey, hermes_inspect_pubkey | default('')] | select | join('\n') }}"
    key_options: 'from="{{ inspect_from }}",command="/usr/local/sbin/homelab-inspect-door",no-pty,no-port-forwarding,no-agent-forwarding,no-X11-forwarding,no-user-rc'
    exclusive: true
  when: inspect_pubkey | default('') | length > 0

- name: inspect may run only homelab-inspect as root
  ansible.builtin.copy:
    dest: /etc/sudoers.d/homelab-inspect
    mode: "0440"
    content: |
      inspect ALL=(root) NOPASSWD: /usr/local/sbin/homelab-inspect
      inspect ALL=(root) NOPASSWD: /usr/local/sbin/homelab-inspect *
    validate: visudo -cf %s
  when: inspect_pubkey | default('') | length > 0
