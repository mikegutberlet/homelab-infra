# A dedicated scratch disk for download churn (SABnzbd's incomplete folder on the media VM,
# 2026-10-22). Until then temp lived on the 64 GB system disk next to every app database and
# paused SABnzbd at 15 GB free, which any season pack reached. The disk is hot-added on the
# Proxmox host (declared in tofu/vms.tf) and shows up as the second SCSI disk.
#
# scratch_disk (hosts.yml):
#   device: /dev/sdb              the raw disk; formatted ONLY when blkid sees nothing on it
#   label: usenet-tmp             filesystem label, also how fstab finds it
#   mount: /srv/usenet-incomplete
# Safety: a disk that already carries any filesystem or partition table and is not ours by label
# stops the play. Nothing here ever touches /dev/sda or the NFS mounts.
# The disk was hot-added seconds ago; give the guest kernel a moment to notice it.
- name: Scratch disk present
  ansible.builtin.wait_for:
    path: "{{ scratch_disk.device }}"
    timeout: 60

- name: Scratch disk is a block device
  ansible.builtin.stat:
    path: "{{ scratch_disk.device }}"
  register: scratch_dev
  failed_when: not scratch_dev.stat.isblk

- name: What is on the disk now
  ansible.builtin.command: blkid -o export {{ scratch_disk.device }}
  register: scratch_blkid
  changed_when: false
  failed_when: scratch_blkid.rc not in [0, 2] # 2 = nothing recognised

- name: Refuse to format a disk that holds something else
  ansible.builtin.assert:
    that:
      - scratch_blkid.rc == 2 or ('LABEL=' ~ scratch_disk.label) in scratch_blkid.stdout
    fail_msg: "{{ scratch_disk.device }} already has data: {{ scratch_blkid.stdout | default('') }}"

- name: ext4 with the label, only on a blank disk
  community.general.filesystem:
    dev: "{{ scratch_disk.device }}"
    fstype: ext4
    opts: "-L {{ scratch_disk.label }} -m 0" # no reserved blocks; nothing of root's lives here
  when: scratch_blkid.rc == 2

- name: Mount point
  ansible.builtin.file:
    path: "{{ scratch_disk.mount }}"
    state: directory
    mode: "0755"

# nofail + a short device timeout: a missing disk must never block the VM's boot.
- name: Mounted by label, in fstab
  ansible.posix.mount:
    src: "LABEL={{ scratch_disk.label }}"
    path: "{{ scratch_disk.mount }}"
    fstype: ext4
    opts: "defaults,noatime,nofail,discard,x-systemd.device-timeout=10"
    state: mounted

- name: Owned by the app user
  ansible.builtin.file:
    path: "{{ scratch_disk.mount }}"
    owner: "{{ app_uid }}"
    group: "{{ app_gid }}"
    mode: "0750"
