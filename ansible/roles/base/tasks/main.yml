- name: Base packages
  ansible.builtin.apt:
    name: [qemu-guest-agent, unattended-upgrades, fail2ban, nfs-common, curl, jq, htop, rsync]
    update_cache: true

- name: Guest agent running (lets Proxmox shut the VM down cleanly)
  ansible.builtin.service:
    name: qemu-guest-agent
    state: started
    enabled: true

- name: Watchdog daemon feeds the virtual i6300esb watchdog
  ansible.builtin.apt:
    name: watchdog

- name: Point the watchdog daemon at the virtual device
  ansible.builtin.lineinfile:
    path: /etc/watchdog.conf
    regexp: "^#?watchdog-device"
    line: "watchdog-device = /dev/watchdog"
  notify: Restart watchdog

- name: Timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: App group
  ansible.builtin.group:
    name: "{{ app_user }}"
    gid: "{{ app_gid }}"

- name: App user, matching file ownership on TrueNAS
  ansible.builtin.user:
    name: "{{ app_user }}"
    uid: "{{ app_uid }}"
    group: "{{ app_user }}"
    shell: /usr/sbin/nologin
    create_home: false

- name: SSH keys only, no root login
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    mode: "0644"
  notify: Restart ssh

- name: IP forwarding for the Tailscale subnet router
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/99-tailscale.conf
  loop: [net.ipv4.ip_forward, net.ipv6.conf.all.forwarding]
  when: "'edge' in (stacks | default([]))"

- name: Security updates install themselves
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

# The cloud image has no swap. Without it, the media VM nearly ran out of memory on 2026-10-22
# (load >100, SSH frozen for minutes). A small swap file absorbs short spikes; swappiness 10
# keeps the apps in RAM the rest of the time.
- name: Swap file
  ansible.builtin.shell: |
    fallocate -l {{ swap_mb }}M /swapfile
    chmod 600 /swapfile
    mkswap /swapfile
  args:
    creates: /swapfile

- name: Swap file in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^/swapfile "
    line: "/swapfile none swap sw 0 0"

- name: Swap file on
  ansible.builtin.command: swapon /swapfile
  register: swapon
  changed_when: swapon.rc == 0
  failed_when: swapon.rc != 0 and 'busy' not in swapon.stderr

- name: Prefer RAM over swap
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    sysctl_file: /etc/sysctl.d/90-swap.conf
