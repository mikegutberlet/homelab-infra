- name: Stack and appdata folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_uid }}"
    group: "{{ app_gid }}"
    mode: "0750"
  loop: ["{{ stacks_root }}", "{{ appdata_root }}"]

# Bind-mount sources that a container running as the app user must write to. Docker would
# otherwise create them owned by root. appdata_owned_dirs: [name, ...] under appdata_root.
- name: App-owned appdata folders
  ansible.builtin.file:
    path: "{{ appdata_root }}/{{ item }}"
    state: directory
    owner: "{{ app_uid }}"
    group: "{{ app_gid }}"
    mode: "0750"
  loop: "{{ appdata_owned_dirs | default([]) }}"

# For images that must run as their own uid: appdata_dir_owners: {name: uid}
- name: Appdata folders owned by a specific uid
  ansible.builtin.file:
    path: "{{ appdata_root }}/{{ item.key }}"
    state: directory
    owner: "{{ item.value }}"
    group: "{{ item.value }}"
    mode: "0750"
  loop: "{{ appdata_dir_owners | default({}) | dict2items }}"

- name: age key folder for root
  ansible.builtin.file:
    path: /root/.config/sops/age
    state: directory
    mode: "0700"

- name: age private key from the Mac (decrypts secrets.sops.env on the VM)
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/.config/sops/age/keys.txt"
    dest: /root/.config/sops/age/keys.txt
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Copy each stack's Compose files
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../stacks/{{ item }}/"
    dest: "{{ stacks_root }}/{{ item }}/"
    delete: false
    owner: false # don't carry the Mac's uid/gid onto the VM
    group: false
    rsync_opts: ["--exclude=*.sops.env"]
  loop: "{{ stacks }}"

- name: Decrypt each stack's secrets into .env (age key lives only on the VM)
  ansible.builtin.shell: |
    set -euo pipefail
    SOPS_AGE_KEY_FILE=/root/.config/sops/age/keys.txt \
      sops --decrypt --input-type dotenv --output-type dotenv /dev/stdin \
      > {{ stacks_root }}/{{ item }}/.env
    chmod 600 {{ stacks_root }}/{{ item }}/.env
  args:
    executable: /bin/bash
    stdin: "{{ lookup('file', playbook_dir ~ '/../../stacks/' ~ item ~ '/secrets.sops.env') }}"
  loop: "{{ stacks }}"
  changed_when: true
  no_log: true

# stack_services: {stack: [service, ...]} starts only those services, e.g. while
# a stack's VPN or API credentials are still placeholders. Unset = whole stack.
- name: Start or update each stack
  ansible.builtin.command:
    cmd: >-
      docker compose up -d --wait --wait-timeout 300
      {{ '' if (stack_services | default({}))[item] is defined else '--remove-orphans' }}
      {{ (stack_services | default({}))[item] | default([]) | join(' ') }}
    chdir: "{{ stacks_root }}/{{ item }}"
  loop: "{{ stacks }}"
  changed_when: true
